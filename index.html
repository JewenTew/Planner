<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: fixed plan rail on the left, working surface on the right (board / grid / schedule / charts). Rail folds into a chip row on phones. */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #e4eae7;
  --ink: #16201c;
  --muted: #5a6964;
  --line: #d3dcd8;
  --accent: #0b7560;
  --accent-ink: #ffffff;
  --accent-soft: #d3ebe3;
  --danger: #bf3328;
  --danger-soft: #f9e0dc;
  --warn: #a86300;
  --warn-soft: #f8e9cb;
  --ok: #2c7a36;
  --ok-soft: #dcefdc;
  --info: #22609f;
  --info-soft: #dce8f6;
  --c1: #d9483b; --c2: #e0901c; --c3: #c9b21a; --c4: #3e9a52; --c5: #2f7fc4; --c6: #8a56c2;
  --shadow: 0 1px 2px rgba(20,40,32,.08), 0 2px 8px rgba(20,40,32,.05);
  --font-body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #171f1c; --surface-2: #202a26; --ink: #e4ebe8; --muted: #93a29c; --line: #2b3732;
    --accent: #3fc3a1; --accent-ink: #062219; --accent-soft: #15392f;
    --danger: #ff7b6f; --danger-soft: #3b1c19; --warn: #f0b24e; --warn-soft: #372910; --ok: #71cf78; --ok-soft: #1a321e; --info: #7fb5f0; --info-soft: #16293e;
    --c1: #f06a5d; --c2: #f0a640; --c3: #e0cb45; --c4: #5cbf70; --c5: #5aa3e6; --c6: #a980dd;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #171f1c; --surface-2: #202a26; --ink: #e4ebe8; --muted: #93a29c; --line: #2b3732;
  --accent: #3fc3a1; --accent-ink: #062219; --accent-soft: #15392f;
  --danger: #ff7b6f; --danger-soft: #3b1c19; --warn: #f0b24e; --warn-soft: #372910; --ok: #71cf78; --ok-soft: #1a321e; --info: #7fb5f0; --info-soft: #16293e;
  --c1: #f06a5d; --c2: #f0a640; --c3: #e0cb45; --c4: #5cbf70; --c5: #5aa3e6; --c6: #a980dd;
  --shadow: 0 1px 2px rgba(0,0,0,.4);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

#app { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }

/* Sidebar */
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.brand b { font-size: 15px; letter-spacing: .01em; display: block; line-height: 1.2; }
.brand small { color: var(--muted); font-size: 12px; }
.rail-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 8px; margin-bottom: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 6px; color: var(--ink); }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: var(--accent-soft); font-weight: 600; }
.nav-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.badge { font-size: 11px; font-family: var(--font-mono); background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 0 7px; line-height: 18px; }
.new-plan { display: flex; gap: 6px; padding: 4px 2px 0; }
.new-plan input { flex: 1; min-width: 0; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 0 8px; display: flex; gap: 6px; align-items: flex-start; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--warn); }
.sync-dot.on { background: var(--ok); }

/* Controls */
.input, select.input, textarea.input { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; min-height: 34px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--surface); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.icon-btn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* Main */
main { min-width: 0; padding-inline: 24px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.head h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.01em; text-wrap: balance; display: flex; align-items: center; gap: 10px; }
.head h1 .dot { width: 14px; height: 14px; border-radius: 4px; }
.head .sub { color: var(--muted); font-size: 13px; }
.head .spacer { flex: 1; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .input { min-height: 32px; }
.toolbar #f-q { width: 200px; max-width: 100%; }
.toolbar label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
.toolbar .grow { flex: 1; }

/* Due chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 20px; padding: 0 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip svg { width: 12px; height: 12px; }
.chip.overdue { background: var(--danger); color: var(--surface); font-weight: 600; }
.chip.today { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.tomorrow, .chip.week { background: var(--info-soft); color: var(--info); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.pri-urgent { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.chip.pri-important { background: var(--warn-soft); color: var(--warn); }
.chip.pri-low { color: var(--muted); }
.chip.doing { background: var(--info-soft); color: var(--info); }
.lbl-c1 { --lc: var(--c1); } .lbl-c2 { --lc: var(--c2); } .lbl-c3 { --lc: var(--c3); } .lbl-c4 { --lc: var(--c4); } .lbl-c5 { --lc: var(--c5); } .lbl-c6 { --lc: var(--c6); }
.bg-c1 { background: var(--c1); } .bg-c2 { background: var(--c2); } .bg-c3 { background: var(--c3); } .bg-c4 { background: var(--c4); } .bg-c5 { background: var(--c5); } .bg-c6 { background: var(--c6); }
.tag { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; color: var(--ink); background: color-mix(in srgb, var(--lc) 22%, transparent); border: 1px solid color-mix(in srgb, var(--lc) 45%, transparent); white-space: nowrap; }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }

/* Board */
.board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
.col { flex: 0 0 284px; background: var(--surface-2); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 2px solid transparent; }
.col.drop-ok { border-color: var(--accent); border-style: dashed; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px; }
.col-head h3 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-head .count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.col-head.overdue h3 { color: var(--danger); }
.qa { width: 100%; background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 7px 10px; min-height: 36px; }
.qa::placeholder { color: var(--muted); }
.qa:focus { border-style: solid; border-color: var(--accent); outline: none; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border: 1px solid transparent; }
.card:hover { border-color: var(--line); }
.card.is-done h4 { text-decoration: line-through; color: var(--muted); }
.card.is-done { opacity: .75; }
.card.dragging { opacity: .4; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.card-top { display: flex; gap: 8px; align-items: flex-start; }
.card-top h4 { margin: 0; font-size: 14px; font-weight: 500; line-height: 1.4; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; flex: none; margin-top: 1px; display: grid; place-items: center; padding: 0; color: transparent; }
.check:hover { border-color: var(--ok); color: var(--ok); }
.check.on { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.check svg { width: 11px; height: 11px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-meta .avatar { margin-left: auto; }
.card-plan { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.add-col { flex: 0 0 220px; }
.empty-col { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0 4px; }

/* Grid */
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.grid { width: 100%; border-collapse: collapse; min-width: 820px; }
.grid th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.grid th[data-sort] { cursor: pointer; }
.grid th[data-sort]:hover { color: var(--ink); }
.grid th .arr { font-family: var(--font-mono); }
.grid td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.grid tr:last-child td { border-bottom: 0; }
.grid tbody tr { cursor: pointer; }
.grid tbody tr:hover td { background: var(--surface-2); }
.grid td.title { font-weight: 500; }
.grid tr.is-done td.title { text-decoration: line-through; color: var(--muted); }

/* Schedule */
.cal-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-bar h2 { margin: 0 8px 0 0; font-size: 17px; font-weight: 600; min-width: 120px; }
.cal-wrap { overflow-x: auto; }
.cal { min-width: 720px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--line); gap: 1px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cal .dow { background: var(--surface-2); font-size: 12px; color: var(--muted); padding: 6px 8px; font-weight: 600; }
.cal .day { background: var(--surface); min-height: 108px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal .day.out { background: var(--bg); }
.cal .day.out .num { opacity: .45; }
.cal .day.weekend { background: color-mix(in srgb, var(--surface) 70%, var(--surface-2)); }
.cal .day-head { display: flex; align-items: center; justify-content: space-between; }
.cal .num { font-family: var(--font-mono); font-size: 12px; color: var(--muted); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.cal .day.is-today .num { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cal .add { opacity: 0; width: 22px; height: 22px; }
.cal .day:hover .add, .cal .add:focus-visible { opacity: 1; }
.cal-task { font-size: 12px; line-height: 1.35; padding: 3px 6px; border-radius: 4px; background: var(--surface-2); border-left: 3px solid var(--muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.cal-task.overdue { border-left-color: var(--danger); background: var(--danger-soft); }
.cal-task.today { border-left-color: var(--warn); background: var(--warn-soft); }
.cal-task.done { border-left-color: var(--ok); text-decoration: line-through; color: var(--muted); }
.cal-task.week, .cal-task.tomorrow, .cal-task.nextweek, .cal-task.later { border-left-color: var(--info); }
.unsched { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.unsched h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.unsched .list { display: flex; flex-wrap: wrap; gap: 6px; }
.unsched .cal-task { width: auto; max-width: 260px; }

/* Hub + charts */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; text-align: left; }
button.stat { cursor: pointer; }
button.stat:hover { border-color: var(--accent); }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; line-height: 1.2; }
.stat.danger .v { color: var(--danger); }
.stat.warn .v { color: var(--warn); }
.stat.info .v { color: var(--info); }
.stat.ok .v { color: var(--ok); }
.hub { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.panel h2 { font-size: 15px; margin: 0 0 10px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.panel h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
.due-list { display: flex; flex-direction: column; }
.due-group { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 0 4px; font-weight: 600; }
.due-group.overdue { color: var(--danger); }
.due-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 4px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 4px; }
.due-row:hover { background: var(--surface-2); }
.due-row .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.due-row .p { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.plan-cards { display: flex; flex-direction: column; gap: 10px; }
.plan-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; background: var(--surface); text-align: left; width: 100%; }
.plan-card:hover { border-color: var(--accent); }
.plan-card .row { display: flex; align-items: center; gap: 8px; }
.plan-card .row b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-card .nums { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.plan-card .nums .mono { color: var(--ink); }
.plan-card .nums .od .mono { color: var(--danger); font-weight: 600; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hbar { display: grid; grid-template-columns: 96px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: 13px; }
.hbar .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .v { font-family: var(--font-mono); text-align: right; color: var(--muted); font-size: 12px; }
.hbar .bar { height: 14px; border-radius: 3px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.s-todo { background: color-mix(in srgb, var(--muted) 45%, var(--surface-2)); }
.s-doing { background: var(--info); }
.s-done { background: var(--ok); }
.s-overdue { background: var(--danger); }

.empty { text-align: center; padding: 48px 16px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.empty h2 { color: var(--ink); margin: 0; font-size: 18px; }
.empty p { margin: 0; max-width: 42ch; }

/* Dialog */
.overlay { position: fixed; inset: 0; background: rgba(8,16,13,.45); display: flex; justify-content: flex-end; z-index: 50; }
.sheet { background: var(--surface); width: min(560px, 100%); height: 100%; overflow-y: auto; padding-inline: 22px; padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; box-shadow: -8px 0 30px rgba(0,0,0,.15); }
.sheet-head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.sheet-head .grow { flex: 1; }
.title-input { font-size: 20px; font-weight: 600; border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 4px 6px; margin-left: -6px; width: calc(100% + 6px); }
.title-input:hover { border-color: var(--line); }
.title-input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; color: var(--muted); font-weight: 500; }
.field .input { width: 100%; }
.section-label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 6px; display: block; }
.label-picks { display: flex; flex-wrap: wrap; gap: 6px; }
.label-pick { border: 1px solid color-mix(in srgb, var(--lc) 50%, transparent); background: transparent; border-radius: 12px; padding: 2px 10px; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; }
.label-pick i { width: 8px; height: 8px; border-radius: 50%; background: var(--lc); }
.label-pick.on { background: color-mix(in srgb, var(--lc) 25%, transparent); font-weight: 600; }
.checklist { display: flex; flex-direction: column; gap: 4px; }
.cl-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.cl-item input[type="text"] { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; padding: 3px 6px; border-radius: 4px; }
.cl-item input[type="text"]:hover { border-color: var(--line); }
.cl-item.done input[type="text"] { text-decoration: line-through; color: var(--muted); }
.cl-item .icon-btn { width: 26px; height: 26px; }
textarea.input { width: 100%; min-height: 96px; resize: vertical; line-height: 1.5; }
.sheet-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.sheet-foot .grow { flex: 1; }
.swatches { display: flex; gap: 8px; }
.swatch { width: 28px; height: 28px; border-radius: 6px; border: 2px solid transparent; }
.swatch.on { border-color: var(--ink); }
.bucket-rows { display: flex; flex-direction: column; gap: 6px; }
.bucket-rows .r { display: flex; gap: 6px; }
.bucket-rows .r .input { flex: 1; min-width: 0; }
.label-names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.label-names label { display: flex; gap: 8px; align-items: center; }
.label-names label i { width: 12px; height: 12px; border-radius: 3px; background: var(--lc); flex: none; }
.label-names .input { flex: 1; min-width: 0; }
.confirm { background: var(--danger-soft); border-radius: 8px; padding: 10px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--ink); font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 80; max-width: calc(100% - 32px); }

@media (max-width: 960px) {
  .hub { grid-template-columns: minmax(0, 1fr); }
  .charts { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 12px 16px; gap: 10px; }
  .rail-label, .brand small, .rail-foot { display: none; }
  .nav { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 2px; }
  .nav-item { width: auto; flex: none; border: 1px solid var(--line); border-radius: 16px; padding: 4px 12px; }
  .nav-item .name { max-width: 140px; }
  main { padding-inline: 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (prefers-reduced-motion: no-preference) {
  .card, .nav-item, .btn, .plan-card { transition: background-color .12s, border-color .12s; }
}
</style>

<div id="app">
  <aside class="rail" id="rail"></aside>
  <main id="main"><div class="loading">正在加载计划…</div></main>
</div>
<div id="dialog-root"></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const LABEL_KEYS = ['c1', 'c2', 'c3', 'c4', 'c5', 'c6'];
const DEFAULT_LABELS = { c1: '紧急客户', c2: '等待回复', c3: '采购', c4: '内部', c5: '现场', c6: '文档' };
const PROGRESS = { todo: '未开始', doing: '进行中', done: '已完成' };
const PRIORITY = { urgent: '紧急', important: '重要', medium: '中等', low: '低' };
const PRI_ORDER = { urgent: 0, important: 1, medium: 2, low: 3 };
const WEEKDAYS = ['一', '二', '三', '四', '五', '六', '日'];
const AVATAR_COLORS = ['#0b7560', '#22609f', '#a0522d', '#7a4bb0', '#b03a5b', '#56733a', '#2f6f8f', '#8a6a12'];
const ICON_CHECK = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';
const ICON_CAL = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.5" y="2.5" width="9" height="8" rx="1.2"/><path d="M1.5 5h9M4 1.2v2.4M8 1.2v2.4"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M1.5 3l1 1 1.6-1.8M1.5 8l1 1 1.6-1.8M6 3.2h4.5M6 8.2h4.5"/></svg>';
const ICON_X = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 3l8 8M11 3l-8 8"/></svg>';
const ICON_PLUS = '<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 2.5v9M2.5 7h9"/></svg>';
const ICON_GEAR = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const today = () => ymd(new Date());
const endOfWeek = s => { const d = parse(s); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() + 6 - dow); return ymd(d); };
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 86400000);
const fmtDate = s => {
  if (!s) return '';
  const d = parse(s);
  return (d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + '年' : '') + (d.getMonth() + 1) + '月' + d.getDate() + '日';
};
const fmtWeekday = s => '周' + WEEKDAYS[(parse(s).getDay() + 6) % 7];

function dueGroup(t) {
  if (!t.due) return 'none';
  const td = today();
  if (t.due < td) return 'overdue';
  if (t.due === td) return 'today';
  if (t.due === addDays(td, 1)) return 'tomorrow';
  const eow = endOfWeek(td);
  if (t.due <= eow) return 'week';
  if (t.due <= addDays(eow, 7)) return 'nextweek';
  return 'later';
}
const dueStatus = t => t.progress === 'done' ? 'done' : dueGroup(t);
function dueText(t) {
  if (!t.due) return '';
  const st = dueStatus(t);
  if (st === 'overdue') return `${fmtDate(t.due)} · 逾期 ${diffDays(t.due, today())} 天`;
  if (st === 'today') return '今天到期';
  if (st === 'tomorrow') return '明天到期';
  return fmtDate(t.due);
}
function dueChip(t) {
  if (!t.due) return '';
  return `<span class="chip ${dueStatus(t)}">${ICON_CAL}${esc(dueText(t))}</span>`;
}
function avatar(name) {
  if (!name) return '';
  const n = name.trim();
  let h = 0; for (const ch of n) h = (h * 31 + ch.codePointAt(0)) >>> 0;
  const initials = /^[\x00-\x7F]/.test(n) ? n.split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() : [...n].slice(-2).join('');
  return `<span class="avatar" style="background:${AVATAR_COLORS[h % AVATAR_COLORS.length]}" title="${esc(n)}">${esc(initials)}</span>`;
}
function cmpTasks(a, b) {
  const da = a.progress === 'done' ? 1 : 0, db = b.progress === 'done' ? 1 : 0;
  if (da !== db) return da - db;
  const ua = a.due || '9999', ub = b.due || '9999';
  if (ua !== ub) return ua < ub ? -1 : 1;
  const pa = PRI_ORDER[a.priority] ?? 2, pb = PRI_ORDER[b.priority] ?? 2;
  if (pa !== pb) return pa - pb;
  return (a.createdAt || 0) - (b.createdAt || 0);
}

/* ---------- state ---------- */
const state = { plans: {}, tasks: {}, plansReady: false, tasksReady: false, mode: 'local', readonly: false };
const PREF_KEY = 'planner-prefs';
const LOCAL_KEY = 'planner-data';
let ui = { planId: 'hub', view: 'board', groupBy: 'bucket', filter: { q: '', due: 'all', pri: 'all', hideDone: false }, calMonth: today().slice(0, 7), sort: { key: 'due', dir: 1 } };
try { const p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); if (p) ui = Object.assign(ui, p, { filter: Object.assign(ui.filter, p.filter || {}) }); } catch (e) {}
const savePrefs = () => { try { localStorage.setItem(PREF_KEY, JSON.stringify(ui)); } catch (e) {} };

const plansList = () => Object.values(state.plans).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
const tasksOf = planId => Object.values(state.tasks).filter(t => t.planId === planId);
const allTasks = () => Object.values(state.tasks).filter(t => state.plans[t.planId]);

/* ---------- store ---------- */
let db = null;
const queues = {};

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}
function handleErr(e) {
  const code = e && e.code;
  if (code === 'invalid_argument') { state.readonly = true; toast('你没有编辑这个计划板的权限，已切换为只读。'); render(); }
  else if (code === 'quota_exceeded') toast('存储空间已满，请删除一些已完成的任务后再试。');
  else if (code === 'revoked') { state.readonly = true; render(); }
  else toast('保存失败，请检查网络后重试。');
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify({ plans: state.plans, tasks: state.tasks })); } catch (e) {}
}
function write(col, id, data) {
  const map = col === 'plans' ? state.plans : state.tasks;
  if (data === null) delete map[id]; else map[id] = Object.assign({}, data, { id });
  render();
  if (state.mode === 'local') { saveLocal(); return; }
  const path = col + '/' + id;
  const body = data === null ? null : (() => { const b = clone(data); delete b.id; return b; })();
  const q = queues[path] || (queues[path] = { running: false, has: false, next: null });
  q.next = body; q.has = true;
  if (!q.running) drain(path);
}
async function drain(path) {
  const q = queues[path];
  q.running = true;
  while (q.has) {
    const body = q.next; q.has = false;
    try {
      const ref = db.doc(path);
      if (body === null) await ref.delete(); else await ref.set(body);
    } catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
        try { const ref = db.doc(path); if (body === null) await ref.delete(); else await ref.set(body); } catch (e2) { handleErr(e2); }
      } else handleErr(e);
    }
  }
  q.running = false;
}
function patchTask(id, patch) {
  const t = state.tasks[id]; if (!t) return;
  const next = Object.assign(clone(t), patch, { updatedAt: Date.now() });
  if (patch.progress) next.completedAt = patch.progress === 'done' ? (t.completedAt || Date.now()) : null;
  write('tasks', id, next);
}
function patchPlan(id, patch) {
  const p = state.plans[id]; if (!p) return;
  write('plans', id, Object.assign(clone(p), patch));
}
function createTask(planId, fields) {
  const plan = state.plans[planId]; if (!plan) return null;
  const id = uid();
  const t = Object.assign({
    planId, title: '新任务', bucketId: plan.buckets[0]?.id || '', progress: 'todo', priority: 'medium',
    start: '', due: '', assignee: '', labels: [], notes: '', checklist: [], createdAt: Date.now(), updatedAt: Date.now(), completedAt: null
  }, fields);
  if (t.progress === 'done') t.completedAt = Date.now();
  write('tasks', id, t);
  return id;
}
function createPlan(name) {
  const id = uid();
  const used = plansList().map(p => p.color);
  const color = LABEL_KEYS.find(c => !used.includes(c)) || LABEL_KEYS[plansList().length % 6];
  write('plans', id, { name, color, createdAt: Date.now(), labels: Object.assign({}, DEFAULT_LABELS), buckets: [{ id: uid(), name: '待办' }, { id: uid(), name: '进行中' }, { id: uid(), name: '等待客户' }] });
  return id;
}

async function initStore() {
  if (window.claude && typeof window.claude.use === 'function') {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
  }
  if (db) {
    state.mode = 'db';
    try {
      const user = await window.claude.use('user');
      if (user) { const c = await user.can('data.write'); if (c === false) state.readonly = true; }
    } catch (e) {}
    const onErr = e => { if (e && (e.code === 'revoked' || e.code === 'not_granted')) state.readonly = true; render(); };
    db.collection('plans').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); });
      state.plans = m; state.plansReady = true; render();
    }, onErr);
    db.collection('tasks').onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = Object.assign({}, d.data(), { id: d.id }); });
      state.tasks = m; state.tasksReady = true; render();
    }, onErr);
  } else {
    state.mode = 'local';
    try {
      const saved = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
      if (saved) { state.plans = saved.plans || {}; state.tasks = saved.tasks || {}; }
    } catch (e) {}
    state.plansReady = state.tasksReady = true;
    render();
  }
}

/* ---------- focus preservation across re-renders ---------- */
function captureFocus() {
  const a = document.activeElement;
  if (!a || !a.id || !$('#app').contains(a)) return null;
  return { id: a.id, value: 'value' in a ? a.value : null, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(f) {
  if (!f) return;
  const el = document.getElementById(f.id); if (!el) return;
  if (f.value != null && el.value !== f.value) el.value = f.value;
  el.focus();
  try { if (f.s != null) el.setSelectionRange(f.s, f.e); } catch (e) {}
}

/* ---------- render ---------- */
function render() {
  if (ui.planId !== 'hub' && state.plansReady && !state.plans[ui.planId]) ui.planId = 'hub';
  const f = captureFocus();
  renderRail();
  renderMain();
  restoreFocus(f);
}

function renderRail() {
  const RO = state.readonly;
  const plans = plansList();
  const hubOverdue = allTasks().filter(t => dueStatus(t) === 'overdue').length;
  $('#rail').innerHTML = `
    <div class="brand"><div class="brand-mark">P</div><div><b>Planner</b><small>项目与截止日期</small></div></div>
    <div>
      <nav class="nav">
        <button class="nav-item ${ui.planId === 'hub' ? 'active' : ''}" data-act="goto" data-plan="hub"><span class="dot" style="background:var(--ink)"></span><span class="name">概览</span>${hubOverdue ? `<span class="badge">${hubOverdue}</span>` : ''}</button>
      </nav>
    </div>
    <div>
      <div class="rail-label">计划</div>
      <nav class="nav">
        ${plans.map(p => {
          const od = tasksOf(p.id).filter(t => dueStatus(t) === 'overdue').length;
          return `<button class="nav-item ${ui.planId === p.id ? 'active' : ''}" data-act="goto" data-plan="${p.id}"><span class="dot bg-${esc(p.color)}"></span><span class="name">${esc(p.name)}</span>${od ? `<span class="badge" title="逾期任务">${od}</span>` : ''}</button>`;
        }).join('')}
        ${!RO ? `<button class="nav-item" data-act="new-plan-show" style="color:var(--muted)">${ICON_PLUS}<span class="name">新建计划</span></button>` : ''}
      </nav>
      <form class="new-plan" id="new-plan-form" hidden>
        <input class="input" id="new-plan-name" placeholder="计划名称，例如：ABC 公司服务器迁移" maxlength="80" autocomplete="off">
        <button class="btn primary" type="submit">创建</button>
      </form>
    </div>
    <div class="rail-foot"><span class="sync-dot ${state.mode === 'db' ? 'on' : ''}"></span><span>${state.mode === 'db' ? (RO ? '只读模式。你可以查看，但不能修改。' : '已云端同步。分享后团队成员可以一起编辑。') : '数据只保存在这个浏览器里。'}</span></div>`;
}

function renderMain() {
  const main = $('#main');
  if (!state.plansReady || !state.tasksReady) { main.innerHTML = '<div class="loading">正在加载计划…</div>'; return; }
  if (ui.planId === 'hub') { main.innerHTML = hubHTML(); return; }
  const plan = state.plans[ui.planId];
  const RO = state.readonly;
  const views = { board: '看板', grid: '表格', schedule: '日程', charts: '图表' };
  main.innerHTML = `
    <div class="head">
      <h1><span class="dot bg-${esc(plan.color)}"></span>${esc(plan.name)}</h1>
      <span class="sub">${tasksOf(plan.id).filter(t => t.progress !== 'done').length} 项未完成</span>
      <span class="spacer"></span>
      ${!RO ? `<button class="btn primary" data-act="new-task">${ICON_PLUS}新建任务</button><button class="btn" data-act="plan-settings">${ICON_GEAR}计划设置</button>` : ''}
    </div>
    <div class="tabs" role="tablist">${Object.entries(views).map(([k, v]) => `<button class="tab ${ui.view === k ? 'active' : ''}" role="tab" aria-selected="${ui.view === k}" data-act="view" data-view="${k}">${v}</button>`).join('')}</div>
    ${ui.view !== 'charts' ? toolbarHTML() : ''}
    <div id="view">${ui.view === 'board' ? boardHTML(plan) : ui.view === 'grid' ? gridHTML(plan) : ui.view === 'schedule' ? scheduleHTML(plan) : chartsHTML(plan)}</div>`;
}

function toolbarHTML() {
  const f = ui.filter;
  const opt = (obj, cur) => Object.entries(obj).map(([k, v]) => `<option value="${k}" ${cur === k ? 'selected' : ''}>${v}</option>`).join('');
  return `<div class="toolbar">
    <input class="input" id="f-q" type="search" placeholder="搜索任务、负责人、备注" value="${esc(f.q)}" autocomplete="off">
    <select class="input" id="f-due" aria-label="截止日期">${opt({ all: '所有截止日期', overdue: '已逾期', today: '今天到期', week: '本周内到期', next14: '14 天内到期', none: '没有截止日期' }, f.due)}</select>
    <select class="input" id="f-pri" aria-label="优先级">${opt({ all: '所有优先级', urgent: '紧急', important: '重要', medium: '中等', low: '低' }, f.pri)}</select>
    <label class="chk"><input type="checkbox" id="f-done" ${f.hideDone ? 'checked' : ''}>隐藏已完成</label>
    <span class="grow"></span>
    ${ui.view === 'board' ? `<label class="chk">分组 <select class="input" id="f-group">${opt({ bucket: '存储桶', due: '截止日期', progress: '进度', priority: '优先级' }, ui.groupBy)}</select></label>` : ''}
  </div>`;
}

function applyFilter(list) {
  const f = ui.filter, q = f.q.trim().toLowerCase(), td = today();
  return list.filter(t => {
    if (f.hideDone && t.progress === 'done') return false;
    if (f.pri !== 'all' && t.priority !== f.pri) return false;
    if (f.due !== 'all') {
      const s = dueStatus(t);
      if (f.due === 'overdue' && s !== 'overdue') return false;
      if (f.due === 'today' && s !== 'today') return false;
      if (f.due === 'week' && !(t.due && t.progress !== 'done' && t.due >= td && t.due <= endOfWeek(td))) return false;
      if (f.due === 'next14' && !(t.due && t.progress !== 'done' && t.due >= td && t.due <= addDays(td, 14))) return false;
      if (f.due === 'none' && t.due) return false;
    }
    if (q && !`${t.title} ${t.assignee || ''} ${t.notes || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function cardHTML(t, showPlan) {
  const RO = state.readonly;
  const plan = state.plans[t.planId];
  const cl = t.checklist || [];
  const clDone = cl.filter(c => c.done).length;
  const labels = (t.labels || []).filter(k => LABEL_KEYS.includes(k));
  return `<article class="card ${t.progress === 'done' ? 'is-done' : ''}" draggable="${!RO}" data-act="open-task" data-id="${t.id}" tabindex="0">
    ${showPlan && plan ? `<div class="card-plan"><span class="dot bg-${esc(plan.color)}" style="width:8px;height:8px"></span>${esc(plan.name)}</div>` : ''}
    ${labels.length ? `<div class="card-tags">${labels.map(k => `<span class="tag lbl-${k}">${esc(plan?.labels?.[k] || DEFAULT_LABELS[k])}</span>`).join('')}</div>` : ''}
    <div class="card-top">
      <button class="check ${t.progress === 'done' ? 'on' : ''}" data-act="toggle-done" data-id="${t.id}" aria-label="${t.progress === 'done' ? '标记为未完成' : '标记为已完成'}" ${RO ? 'disabled' : ''}>${ICON_CHECK}</button>
      <h4>${esc(t.title)}</h4>
    </div>
    ${(t.due || cl.length || t.assignee || t.priority === 'urgent' || t.priority === 'important' || t.progress === 'doing') ? `<div class="card-meta">
      ${dueChip(t)}
      ${t.priority === 'urgent' || t.priority === 'important' ? `<span class="chip pri-${t.priority}">${PRIORITY[t.priority]}</span>` : ''}
      ${t.progress === 'doing' ? '<span class="chip doing">进行中</span>' : ''}
      ${cl.length ? `<span class="chip ${clDone === cl.length ? 'done' : ''}">${ICON_LIST}<span class="mono">${clDone}/${cl.length}</span></span>` : ''}
      ${avatar(t.assignee)}
    </div>` : ''}
  </article>`;
}

function boardColumns(plan) {
  const td = today();
  const g = ui.groupBy;
  if (g === 'progress') return Object.entries(PROGRESS).map(([k, v]) => ({ key: k, name: v, match: t => (t.progress || 'todo') === k, drop: { progress: k }, add: { progress: k } }));
  if (g === 'priority') return Object.entries(PRIORITY).map(([k, v]) => ({ key: k, name: v, match: t => (t.priority || 'medium') === k, drop: { priority: k }, add: { priority: k } }));
  if (g === 'due') {
    const defs = [
      ['overdue', '已逾期', null], ['today', '今天', td], ['tomorrow', '明天', addDays(td, 1)], ['week', '本周', null],
      ['nextweek', '下周', null], ['later', '以后', null], ['none', '没有截止日期', '']
    ];
    return defs.map(([k, v, date]) => ({ key: k, name: v, match: t => dueGroup(t) === k, drop: date === null ? null : { due: date }, add: date === null ? null : { due: date }, cls: k === 'overdue' ? 'overdue' : '' }));
  }
  const ids = plan.buckets.map(b => b.id);
  return plan.buckets.map((b, i) => ({ key: b.id, name: b.name, match: t => t.bucketId === b.id || (i === 0 && !ids.includes(t.bucketId)), drop: { bucketId: b.id }, add: { bucketId: b.id } }));
}

function boardHTML(plan) {
  const RO = state.readonly;
  const tasks = applyFilter(tasksOf(plan.id));
  const cols = boardColumns(plan);
  return `<div class="board">${cols.map(c => {
    const list = tasks.filter(c.match).sort(cmpTasks);
    return `<section class="col" data-drop='${c.drop && !RO ? esc(JSON.stringify(c.drop)) : ''}'>
      <div class="col-head ${c.cls || ''}"><h3>${esc(c.name)}</h3><span class="count">${list.length}</span></div>
      ${c.add && !RO ? `<input class="qa" id="qa-${esc(c.key)}" data-add='${esc(JSON.stringify(c.add))}' placeholder="+ 添加任务，回车保存" maxlength="200" autocomplete="off">` : ''}
      ${list.map(t => cardHTML(t)).join('')}
      ${!list.length ? '<div class="empty-col">暂无任务</div>' : ''}
    </section>`;
  }).join('')}
  ${ui.groupBy === 'bucket' && !RO ? `<section class="add-col"><form id="add-bucket-form" style="display:flex;gap:6px"><input class="input" id="add-bucket-name" placeholder="添加存储桶" maxlength="40" style="flex:1;min-width:0" autocomplete="off"><button class="btn" type="submit">添加</button></form></section>` : ''}
  </div>`;
}

function gridHTML(plan) {
  const tasks = applyFilter(tasksOf(plan.id));
  const bucketName = id => (plan.buckets.find(b => b.id === id) || plan.buckets[0] || {}).name || '';
  const s = ui.sort;
  const key = {
    title: t => t.title.toLowerCase(), bucket: t => bucketName(t.bucketId), progress: t => ['todo', 'doing', 'done'].indexOf(t.progress),
    priority: t => PRI_ORDER[t.priority] ?? 2, start: t => t.start || '9999', due: t => t.due || '9999', assignee: t => (t.assignee || '￿').toLowerCase()
  }[s.key] || (t => t.due || '9999');
  tasks.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : cmpTasks(a, b)) * (x === y ? 1 : s.dir); });
  const th = (k, label) => `<th data-sort="${k}">${label} ${s.key === k ? `<span class="arr">${s.dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;
  if (!tasks.length) return emptyFiltered();
  return `<div class="table-wrap"><table class="grid">
    <thead><tr><th style="width:40px"></th>${th('title', '任务名称')}${th('bucket', '存储桶')}${th('progress', '进度')}${th('priority', '优先级')}${th('start', '开始日期')}${th('due', '截止日期')}${th('assignee', '负责人')}</tr></thead>
    <tbody>${tasks.map(t => `<tr class="${t.progress === 'done' ? 'is-done' : ''}" data-act="open-task" data-id="${t.id}">
      <td><button class="check ${t.progress === 'done' ? 'on' : ''}" data-act="toggle-done" data-id="${t.id}" aria-label="切换完成" ${state.readonly ? 'disabled' : ''}>${ICON_CHECK}</button></td>
      <td class="title">${esc(t.title)}</td>
      <td>${esc(bucketName(t.bucketId))}</td>
      <td><span class="chip ${t.progress === 'done' ? 'done' : t.progress === 'doing' ? 'doing' : ''}">${PROGRESS[t.progress] || '未开始'}</span></td>
      <td><span class="chip pri-${t.priority}">${PRIORITY[t.priority] || '中等'}</span></td>
      <td class="mono">${t.start ? esc(t.start) : '<span style="color:var(--muted)">·</span>'}</td>
      <td>${t.due ? dueChip(t) : '<span style="color:var(--muted)">·</span>'}</td>
      <td>${t.assignee ? `<span style="display:inline-flex;gap:6px;align-items:center">${avatar(t.assignee)}${esc(t.assignee)}</span>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function emptyFiltered() {
  return `<div class="empty"><h2>没有符合条件的任务</h2><p>试试清除搜索词，或把截止日期和优先级筛选改回“所有”。</p><button class="btn" data-act="clear-filter">清除筛选</button></div>`;
}

function scheduleHTML(plan) {
  const RO = state.readonly;
  const tasks = applyFilter(tasksOf(plan.id));
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7));
  const last = new Date(y, m, 0);
  const cells = [];
  const d = new Date(start);
  while (d <= last || cells.length % 7 !== 0) { cells.push(ymd(d)); d.setDate(d.getDate() + 1); }
  const td = today();
  const byDay = {};
  tasks.forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t); });
  const unsched = tasks.filter(t => !t.due).sort(cmpTasks);
  return `<div style="display:flex;flex-direction:column;gap:12px">
    <div class="cal-bar">
      <h2>${y}年${m}月</h2>
      <button class="btn" data-act="cal-move" data-dir="-1" aria-label="上个月">‹</button>
      <button class="btn" data-act="cal-move" data-dir="0">今天</button>
      <button class="btn" data-act="cal-move" data-dir="1" aria-label="下个月">›</button>
      <span class="sub" style="color:var(--muted);font-size:12px">按截止日期显示</span>
    </div>
    <div class="cal-wrap"><div class="cal">
      ${WEEKDAYS.map(w => `<div class="dow">周${w}</div>`).join('')}
      ${cells.map((c, i) => {
        const list = (byDay[c] || []).sort(cmpTasks);
        const inMonth = c.slice(0, 7) === ui.calMonth;
        return `<div class="day ${inMonth ? '' : 'out'} ${c === td ? 'is-today' : ''} ${i % 7 >= 5 ? 'weekend' : ''}">
          <div class="day-head"><span class="num">${parse(c).getDate()}</span>${!RO ? `<button class="icon-btn add" data-act="cal-add" data-date="${c}" aria-label="在 ${fmtDate(c)} 添加任务">${ICON_PLUS}</button>` : ''}</div>
          ${list.map(t => `<button class="cal-task ${dueStatus(t)}" data-act="open-task" data-id="${t.id}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}
        </div>`;
      }).join('')}
    </div></div>
    ${unsched.length ? `<div class="unsched"><h3>没有截止日期（${unsched.length}）</h3><div class="list">${unsched.map(t => `<button class="cal-task ${t.progress === 'done' ? 'done' : ''}" data-act="open-task" data-id="${t.id}">${esc(t.title)}</button>`).join('')}</div></div>` : ''}
  </div>`;
}

function statusOf(t) { const s = dueStatus(t); if (s === 'overdue') return 'overdue'; return t.progress || 'todo'; }
function stackBar(list, total) {
  const c = { todo: 0, doing: 0, done: 0, overdue: 0 };
  list.forEach(t => c[statusOf(t)]++);
  const w = n => total ? (n / total * 100).toFixed(2) + '%' : '0';
  return `<div class="bar">${['done', 'doing', 'todo', 'overdue'].map(k => c[k] ? `<i class="s-${k}" style="width:${w(c[k])}" title="${k === 'overdue' ? '已逾期' : PROGRESS[k]} ${c[k]}"></i>` : '').join('')}</div>`;
}

function chartsHTML(plan) {
  const tasks = tasksOf(plan.id);
  if (!tasks.length) return `<div class="empty"><h2>还没有任务</h2><p>添加任务之后，这里会显示进度、逾期情况和每个人的工作量。</p></div>`;
  const cnt = { todo: 0, doing: 0, done: 0, overdue: 0 };
  tasks.forEach(t => cnt[statusOf(t)]++);
  const legend = `<div class="legend"><span><i class="s-done"></i>已完成</span><span><i class="s-doing"></i>进行中</span><span><i class="s-todo"></i>未开始</span><span><i class="s-overdue"></i>已逾期</span></div>`;
  const rows = (groups) => {
    const max = Math.max(1, ...groups.map(g => g.list.length));
    return `<div class="hbars">${groups.map(g => `<div class="hbar"><span class="n" title="${esc(g.name)}">${esc(g.name)}</span><div style="width:${(g.list.length / max * 100).toFixed(2)}%;min-width:${g.list.length ? '4px' : '0'}">${stackBar(g.list, g.list.length)}</div><span class="v">${g.list.length}</span></div>`).join('')}</div>`;
  };
  const ids = plan.buckets.map(b => b.id);
  const byBucket = plan.buckets.map((b, i) => ({ name: b.name, list: tasks.filter(t => t.bucketId === b.id || (i === 0 && !ids.includes(t.bucketId))) }));
  const byPri = Object.entries(PRIORITY).map(([k, v]) => ({ name: v, list: tasks.filter(t => (t.priority || 'medium') === k) }));
  const people = {};
  tasks.filter(t => t.progress !== 'done').forEach(t => { const n = t.assignee?.trim() || '未分配'; (people[n] = people[n] || []).push(t); });
  const byPerson = Object.entries(people).map(([name, list]) => ({ name, list })).sort((a, b) => b.list.length - a.list.length);
  return `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">
      <div class="stat"><span class="k">未开始</span><span class="v">${cnt.todo}</span></div>
      <div class="stat info"><span class="k">进行中</span><span class="v">${cnt.doing}</span></div>
      <div class="stat ok"><span class="k">已完成</span><span class="v">${cnt.done}</span></div>
      <div class="stat danger"><span class="k">已逾期</span><span class="v">${cnt.overdue}</span></div>
    </div>
    <div class="charts">
      <div class="panel"><h2>按存储桶</h2>${legend}${rows(byBucket)}</div>
      <div class="panel"><h2>按优先级</h2>${legend}${rows(byPri)}</div>
      <div class="panel"><h2>按负责人 <small>未完成的任务</small></h2>${legend}${byPerson.length ? rows(byPerson) : '<p style="color:var(--muted);margin:0">所有任务都完成了。</p>'}</div>
      <div class="panel"><h2>整体进度</h2>
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px"><span class="mono" style="font-size:32px">${Math.round(cnt.done / tasks.length * 100)}%</span><span style="color:var(--muted)">已完成 ${cnt.done} / ${tasks.length}</span></div>
        <div style="--h:1">${stackBar(tasks, tasks.length).replace('class="bar"', 'class="bar" style="height:14px"')}</div>
      </div>
    </div>
  </div>`;
}

function hubHTML() {
  const RO = state.readonly;
  const plans = plansList();
  const td = today();
  if (!plans.length) {
    return `<div class="head"><h1>概览</h1></div>
      <div class="empty"><h2>还没有任何计划</h2><p>为每个客户项目建一个计划，把任务、负责人和截止日期放进去。逾期和即将到期的任务会集中显示在这里。</p>${!RO ? '<button class="btn primary" data-act="new-plan-show">新建第一个计划</button>' : ''}</div>`;
  }
  const tasks = allTasks();
  const open = tasks.filter(t => t.progress !== 'done');
  const overdue = open.filter(t => t.due && t.due < td);
  const dueToday = open.filter(t => t.due === td);
  const dueWeek = open.filter(t => t.due && t.due >= td && t.due <= endOfWeek(td));
  const doing = open.filter(t => t.progress === 'doing');
  const horizon = addDays(td, 14);
  const soon = open.filter(t => t.due && t.due <= horizon).sort(cmpTasks);
  const groups = [
    ['overdue', '已逾期', soon.filter(t => t.due < td)],
    ['today', '今天', soon.filter(t => t.due === td)],
    ['week', '本周剩余', soon.filter(t => t.due > td && t.due <= endOfWeek(td))],
    ['next', '未来 14 天', soon.filter(t => t.due > endOfWeek(td))]
  ].filter(g => g[2].length);
  const d = new Date();
  return `
    <div class="head"><h1>概览</h1><span class="sub">今天是 ${d.getMonth() + 1}月${d.getDate()}日 ${fmtWeekday(td)}</span></div>
    <div class="stats">
      <button class="stat danger" data-act="hub-filter" data-due="overdue"><span class="k">已逾期</span><span class="v">${overdue.length}</span></button>
      <button class="stat warn" data-act="hub-filter" data-due="today"><span class="k">今天到期</span><span class="v">${dueToday.length}</span></button>
      <button class="stat info" data-act="hub-filter" data-due="week"><span class="k">本周内到期</span><span class="v">${dueWeek.length}</span></button>
      <div class="stat"><span class="k">进行中</span><span class="v">${doing.length}</span></div>
    </div>
    <div class="hub">
      <section class="panel"><h2>需要关注 <small>逾期及 14 天内到期的未完成任务</small></h2>
        ${groups.length ? `<div class="due-list">${groups.map(([k, name, list]) => `<div class="due-group ${k === 'overdue' ? 'overdue' : ''}">${name} · ${list.length}</div>${list.map(t => {
          const p = state.plans[t.planId];
          return `<div class="due-row" data-act="open-task" data-id="${t.id}" tabindex="0">
            <button class="check" data-act="toggle-done" data-id="${t.id}" aria-label="标记为已完成" ${RO ? 'disabled' : ''}>${ICON_CHECK}</button>
            <div style="min-width:0"><div class="t">${esc(t.title)}</div><div class="p"><span class="dot bg-${esc(p.color)}" style="width:8px;height:8px"></span>${esc(p.name)}${t.assignee ? ' · ' + esc(t.assignee) : ''}</div></div>
            ${dueChip(t)}
          </div>`;
        }).join('')}`).join('')}</div>` : '<p style="color:var(--muted);margin:0">未来两周没有到期的任务。</p>'}
      </section>
      <section class="panel"><h2>所有计划 <small>${plans.length} 个</small></h2>
        <div class="plan-cards">${plans.map(p => {
          const ts = tasksOf(p.id);
          const done = ts.filter(t => t.progress === 'done').length;
          const od = ts.filter(t => dueStatus(t) === 'overdue').length;
          const wk = ts.filter(t => t.progress !== 'done' && t.due && t.due >= td && t.due <= endOfWeek(td)).length;
          const next = ts.filter(t => t.progress !== 'done' && t.due && t.due >= td).sort(cmpTasks)[0];
          return `<button class="plan-card" data-act="goto" data-plan="${p.id}">
            <div class="row"><span class="dot bg-${esc(p.color)}"></span><b>${esc(p.name)}</b><span class="mono" style="color:var(--muted);font-size:12px">${done}/${ts.length}</span></div>
            ${stackBar(ts, ts.length)}
            <div class="nums"><span class="${od ? 'od' : ''}">逾期 <span class="mono">${od}</span></span><span>本周到期 <span class="mono">${wk}</span></span>${next ? `<span>下一个：${esc(fmtDate(next.due))}</span>` : ''}</div>
          </button>`;
        }).join('')}</div>
      </section>
    </div>`;
}

/* ---------- task dialog ---------- */
let openTaskId = null;
let openPlanSettingsId = null;

function closeDialog() {
  if (openTaskId) flushTaskDialog();
  openTaskId = null; openPlanSettingsId = null;
  $('#dialog-root').innerHTML = '';
}
function flushTaskDialog() {
  const t = state.tasks[openTaskId]; if (!t || state.readonly) return;
  const title = $('#t-title')?.value.trim();
  const notes = $('#t-notes')?.value;
  const patch = {};
  if (title && title !== t.title) patch.title = title;
  if (notes != null && notes !== (t.notes || '')) patch.notes = notes;
  if (Object.keys(patch).length) patchTask(t.id, patch);
}

function openTask(id, focusTitle) {
  const t = state.tasks[id]; if (!t) return;
  const plan = state.plans[t.planId]; if (!plan) return;
  openPlanSettingsId = null;
  openTaskId = id;

  $('#dialog-root').innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-label="任务详情">
    <div class="sheet-head"><span class="dot bg-${esc(plan.color)}"></span><span>${esc(plan.name)}</span><span class="grow"></span><button class="icon-btn" data-act="close" aria-label="关闭">${ICON_X}</button></div>
    <input class="title-input" id="t-title" value="${esc(t.title)}" maxlength="200" ${dis} aria-label="任务名称">
    <div class="fields">
      <label class="field"><span>存储桶</span>${sel('t-bucket', buckets, bucketCur)}</label>
      <label class="field"><span>进度</span>${sel('t-progress', PROGRESS, t.progress || 'todo')}</label>
      <label class="field"><span>优先级</span>${sel('t-priority', PRIORITY, t.priority || 'medium')}</label>
      <label class="field"><span>开始日期</span><input class="input" type="date" id="t-start" value="${esc(t.start || '')}" ${dis}></label>
      <label class="field"><span>截止日期</span><input class="input" type="date" id="t-due" value="${esc(t.due || '')}" ${dis}></label>

    </div>
    <datalist id="people">${[...new Set(allTasks().map(x => x.assignee).filter(Boolean))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>

    <div><span class="section-label">标签</span><div class="label-picks">${LABEL_KEYS.map(k => `<button class="label-pick lbl-${k} ${(t.labels || []).includes(k) ? 'on' : ''}" data-act="toggle-label" data-label="${k}" ${dis}><i></i>${esc(plan.labels?.[k] || DEFAULT_LABELS[k])}</button>`).join('')}</div></div>
    <div><label class="section-label" for="t-notes">备注</label><textarea class="input" id="t-notes" placeholder="客户联系人、工单号、现场情况等" ${dis}>${esc(t.notes || '')}</textarea></div>
    <div><span class="section-label">清单</span><div id="t-checklist">${checklistHTML(t)}</div></div>
    <div class="sheet-foot" id="t-foot">${taskFootHTML(t)}</div>
  </div></div>`;
  const ti = $('#t-title');
  if (focusTitle && ti && !RO) { ti.focus(); ti.select(); } else $('.sheet [data-act="close"]').focus();
}
function taskFootHTML(t) {
  const created = t.createdAt ? new Date(t.createdAt) : null;
  const done = t.completedAt ? new Date(t.completedAt) : null;
  return `<span>${created ? `创建于 ${fmtDate(ymd(created))}` : ''}${done && t.progress === 'done' ? ` · 完成于 ${fmtDate(ymd(done))}` : ''}</span><span class="grow"></span>${!state.readonly ? '<button class="btn danger" data-act="delete-task-ask">删除任务</button>' : ''}`;
}
function checklistHTML(t) {
  const RO = state.readonly;
  const cl = t.checklist || [];
  return `<div class="checklist">${cl.map(c => `<div class="cl-item ${c.done ? 'done' : ''}">
      <button class="check ${c.done ? 'on' : ''}" data-act="cl-toggle" data-cl="${esc(c.id)}" aria-label="切换" ${RO ? 'disabled' : ''}>${ICON_CHECK}</button>

    ${!RO ? `<form id="cl-add" style="display:flex;gap:6px;margin-top:4px"><input class="input" id="cl-new" placeholder="添加清单项" maxlength="200" style="flex:1;min-width:0" autocomplete="off"><button class="btn" type="submit">添加</button></form>` : ''}
  </div>`;
}
function refreshChecklist() {
  const t = state.tasks[openTaskId]; if (!t) return;

}

      <form id="p-bucket-add" class="r"><input class="input" id="p-bucket-new" placeholder="新存储桶名称" maxlength="40" autocomplete="off"><button class="btn" type="submit">添加</button></form>
    </div></div>
    <div><span class="section-label">标签名称</span><div class="label-names">${LABEL_KEYS.map(k => `<label class="lbl-${k}"><i></i><input class="input" data-labelname="${k}" value="${esc(p.labels?.[k] ?? DEFAULT_LABELS[k])}" maxlength="24"></label>`).join('')}</div></div>
    <div class="sheet-foot" id="p-foot">${keepConfirm ? planDeleteConfirm(n) : `<span>共 ${n} 项任务</span><span class="grow"></span><button class="btn danger" data-act="plan-delete-ask">删除计划</button>`}</div>
  </div></div>`;
}
const planDeleteConfirm = n => `<div class="confirm" style="width:100%"><span class="grow">删除这个计划和其中的 ${n} 项任务？此操作无法撤销。</span><button class="btn" data-act="plan-delete-cancel">取消</button><button class="btn danger solid" data-act="plan-delete">删除</button></div>`;

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const RO = state.readonly;
  switch (act) {
    case 'goto': ui.planId = el.dataset.plan; savePrefs(); render(); window.scrollTo(0, 0); break;
    case 'view': ui.view = el.dataset.view; savePrefs(); render(); break;
    case 'new-plan-show': {
      const f = $('#new-plan-form'); f.hidden = false; $('#new-plan-name').focus(); break;
    }
    case 'toggle-done': {
      e.stopPropagation(); if (RO) break;
      const t = state.tasks[el.dataset.id]; if (!t) break;
      patchTask(t.id, { progress: t.progress === 'done' ? 'todo' : 'done' });
      break;
    }
    case 'open-task': openTask(el.dataset.id); break;
    case 'new-task': {
      const plan = state.plans[ui.planId];
      const id = createTask(ui.planId, { bucketId: plan.buckets[0]?.id });
      if (id) openTask(id, true);
      break;
    }
    case 'cal-add': { const id = createTask(ui.planId, { due: el.dataset.date }); if (id) openTask(id, true); break; }
    case 'cal-move': {
      const dir = +el.dataset.dir;
      if (dir === 0) ui.calMonth = today().slice(0, 7);
      else { const [y, m] = ui.calMonth.split('-').map(Number); const d = new Date(y, m - 1 + dir, 1); ui.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; }
      savePrefs(); render(); break;
    }
    case 'clear-filter': ui.filter = { q: '', due: 'all', pri: 'all', hideDone: false }; savePrefs(); render(); break;
    case 'hub-filter': {
      const first = plansList().find(p => tasksOf(p.id).some(t => { const s = dueStatus(t); return el.dataset.due === 'overdue' ? s === 'overdue' : el.dataset.due === 'today' ? s === 'today' : (t.progress !== 'done' && t.due && t.due >= today() && t.due <= endOfWeek(today())); }));
      if (!first) { toast('没有符合条件的任务。'); break; }
      ui.planId = first.id; ui.view = 'grid'; ui.filter = { q: '', due: el.dataset.due, pri: 'all', hideDone: false }; savePrefs(); render();
      break;
    }
    case 'plan-settings': openPlanSettings(ui.planId); break;
    case 'overlay': if (e.target === el) closeDialog(); break;
    case 'close': closeDialog(); break;
    case 'toggle-label': {
      const t = state.tasks[openTaskId]; if (!t || RO) break;
      const k = el.dataset.label;
      const labels = (t.labels || []).includes(k) ? t.labels.filter(x => x !== k) : [...(t.labels || []), k];
      el.classList.toggle('on');
      patchTask(t.id, { labels });
      break;
    }
    case 'cl-toggle': {
      const t = state.tasks[openTaskId]; if (!t || RO) break;
      patchTask(t.id, { checklist: (t.checklist || []).map(c => c.id === el.dataset.cl ? Object.assign({}, c, { done: !c.done }) : c) });
      refreshChecklist(); break;
    }
    case 'cl-del': {
      const t = state.tasks[openTaskId]; if (!t || RO) break;
      patchTask(t.id, { checklist: (t.checklist || []).filter(c => c.id !== el.dataset.cl) });
      refreshChecklist(); break;
    }
    case 'delete-task-ask':
      $('#t-foot').innerHTML = `<div class="confirm" style="width:100%"><span class="grow">删除这个任务？此操作无法撤销。</span><button class="btn" data-act="delete-task-cancel">取消</button><button class="btn danger solid" data-act="delete-task">删除</button></div>`;
      break;
    case 'delete-task-cancel': { const t = state.tasks[openTaskId]; if (t) $('#t-foot').innerHTML = taskFootHTML(t); break; }
    case 'delete-task': { const id = openTaskId; openTaskId = null; $('#dialog-root').innerHTML = ''; write('tasks', id, null); toast('任务已删除'); break; }
    case 'plan-color': patchPlan(openPlanSettingsId, { color: el.dataset.color }); openPlanSettings(openPlanSettingsId); break;
    case 'bucket-del': {
      const p = state.plans[openPlanSettingsId]; if (!p) break;
      const rest = p.buckets.filter(b => b.id !== el.dataset.bucket);
      tasksOf(p.id).filter(t => t.bucketId === el.dataset.bucket).forEach(t => patchTask(t.id, { bucketId: rest[0].id }));
      patchPlan(p.id, { buckets: rest });
      openPlanSettings(p.id); break;
    }
    case 'plan-delete-ask': $('#p-foot').innerHTML = planDeleteConfirm(tasksOf(openPlanSettingsId).length); break;
    case 'plan-delete-cancel': openPlanSettings(openPlanSettingsId); break;
    case 'plan-delete': {
      const id = openPlanSettingsId;
      closeDialog();
      tasksOf(id).forEach(t => write('tasks', t.id, null));
      write('plans', id, null);
      ui.planId = 'hub'; savePrefs(); render();
      toast('计划已删除');
      break;
    }
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#dialog-root').firstChild) { closeDialog(); return; }
  if (e.key === 'Enter' && e.target.matches('[data-act="open-task"]') && !e.target.matches('button')) { openTask(e.target.dataset.id); return; }
  if (e.key === 'Enter' && e.target.classList.contains('qa')) {
    e.preventDefault();
    const title = e.target.value.trim(); if (!title) return;
    const add = JSON.parse(e.target.dataset.add || '{}');
    e.target.value = '';
    createTask(ui.planId, Object.assign({ title }, add));
    // keep focus in the same quick-add box for rapid entry
    const id = e.target.id; requestAnimationFrame(() => document.getElementById(id)?.focus());
  }
});

let qTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'f-q') {
    clearTimeout(qTimer);
    const v = e.target.value;
    qTimer = setTimeout(() => { ui.filter.q = v; savePrefs(); render(); }, 180);
  }
});

document.addEventListener('change', e => {
  const el = e.target, id = el.id;
  if (id === 'f-due') { ui.filter.due = el.value; savePrefs(); render(); return; }
  if (id === 'f-pri') { ui.filter.pri = el.value; savePrefs(); render(); return; }
  if (id === 'f-done') { ui.filter.hideDone = el.checked; savePrefs(); render(); return; }
  if (id === 'f-group') { ui.groupBy = el.value; savePrefs(); render(); return; }
  if (state.readonly) return;
  const t = state.tasks[openTaskId];
  if (t) {
    if (id === 't-title') { const v = el.value.trim(); if (v && v !== t.title) patchTask(t.id, { title: v }); else el.value = t.title; }
    else if (id === 't-bucket') patchTask(t.id, { bucketId: el.value });
    else if (id === 't-progress') { patchTask(t.id, { progress: el.value }); $('#t-foot').innerHTML = taskFootHTML(state.tasks[t.id]); }
    else if (id === 't-priority') patchTask(t.id, { priority: el.value });
    else if (id === 't-start') patchTask(t.id, { start: el.value });
    else if (id === 't-due') { patchTask(t.id, { due: el.value }); openTask(t.id); }
    else if (id === 't-assignee') patchTask(t.id, { assignee: el.value.trim() });
    else if (id === 't-notes') patchTask(t.id, { notes: el.value });
    else if (el.dataset.cl && el.type === 'text') {
      const v = el.value.trim();
      patchTask(t.id, { checklist: v ? t.checklist.map(c => c.id === el.dataset.cl ? Object.assign({}, c, { text: v }) : c) : t.checklist.filter(c => c.id !== el.dataset.cl) });
      if (!v) refreshChecklist();
    }
    return;
  }
  const p = state.plans[openPlanSettingsId];
  if (p) {
    if (id === 'p-name') { const v = el.value.trim(); if (v && v !== p.name) patchPlan(p.id, { name: v }); else el.value = p.name; }
    else if (el.dataset.bucket) { const v = el.value.trim(); if (v) patchPlan(p.id, { buckets: p.buckets.map(b => b.id === el.dataset.bucket ? { id: b.id, name: v } : b) }); else el.value = p.buckets.find(b => b.id === el.dataset.bucket)?.name || ''; }
    else if (el.dataset.labelname) { patchPlan(p.id, { labels: Object.assign({}, DEFAULT_LABELS, p.labels, { [el.dataset.labelname]: el.value.trim() || DEFAULT_LABELS[el.dataset.labelname] }) }); }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (state.readonly) return;
  if (f.id === 'new-plan-form') {
    const name = $('#new-plan-name').value.trim(); if (!name) return;
    const id = createPlan(name);
    ui.planId = id; ui.view = 'board'; ui.groupBy = 'bucket'; savePrefs(); render();
  } else if (f.id === 'add-bucket-form') {
    const name = $('#add-bucket-name').value.trim(); if (!name) return;
    const p = state.plans[ui.planId];
    $('#add-bucket-name').value = '';
    patchPlan(p.id, { buckets: [...p.buckets, { id: uid(), name }] });
  } else if (f.id === 'p-bucket-add') {
    const name = $('#p-bucket-new').value.trim(); if (!name) return;
    const p = state.plans[openPlanSettingsId];
    patchPlan(p.id, { buckets: [...p.buckets, { id: uid(), name }] });
    openPlanSettings(p.id);
    $('#p-bucket-new').focus();
  } else if (f.id === 'cl-add') {
    const text = $('#cl-new').value.trim(); if (!text) return;
    const t = state.tasks[openTaskId]; if (!t) return;
    patchTask(t.id, { checklist: [...(t.checklist || []), { id: uid(), text, done: false }] });
    refreshChecklist();
    $('#cl-new').focus();
  }
});

/* drag and drop between board columns */
let dragId = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest && e.target.closest('.card[draggable="true"]');
  if (!card) return;
  dragId = card.dataset.id; card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.dragging, .drop-ok').forEach(n => n.classList.remove('dragging', 'drop-ok'));
});
document.addEventListener('dragover', e => {
  const col = e.target.closest && e.target.closest('.col');
  document.querySelectorAll('.drop-ok').forEach(n => { if (n !== col) n.classList.remove('drop-ok'); });
  if (!dragId || !col || !col.dataset.drop) return;
  e.preventDefault(); col.classList.add('drop-ok');
});
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.col');
  if (!dragId || !col || !col.dataset.drop) return;
  e.preventDefault();
  const patch = JSON.parse(col.dataset.drop);
  const id = dragId; dragId = null;
  patchTask(id, patch);
});

/* refresh "today" math when the date rolls over */
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);

render();
initStore();
})();
</script>

</body>
</html>
