<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: frosted plan rail on the left, working surface on the right, floating over a soft pink-to-blue sky. Rail folds into a chip row on phones. */
:root {
  --bg: #ffffff;
  --glow-1: #ffeaf3;
  --glow-2: #e6f2ff;
  --glow-3: #ffffff;
  --star: rgba(224, 96, 154, .0);
  --surface: rgba(255, 255, 255, .9);
  --surface-solid: #ffffff;
  --surface-2: #f4f9ff;
  --ink: #33304a;
  --muted: #7d7a96;
  --line: #ece6f1;
  --accent: #f5aecb;
  --accent-2: #a8d0f5;
  --accent-ink: #33304a;
  --accent-deep: #d86f9c;
  --accent-soft: #feeef5;
  --blue-soft: #e9f3ff;
  --danger: #d63d57;
  --danger-soft: #fde0e5;
  --warn: #b8660f;
  --warn-soft: #ffead6;
  --ok: #2f8a64;
  --ok-soft: #dcf3e8;
  --info: #3f73cf;
  --info-soft: #e0ebff;
  --c1: #ec5f97; --c2: #f59a5b; --c3: #d9b52e; --c4: #3fb48f; --c5: #4d9be6; --c6: #9a7be0;
  --shadow: 0 1px 2px rgba(120, 80, 160, .08), 0 6px 18px rgba(120, 80, 160, .07);
  --overlay: rgba(60, 40, 90, .28);
  --font-display: "Quicksand", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Nunito", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14112a; --glow-1: #4d2552; --glow-2: #1c3566; --glow-3: #2d2260; --star: rgba(255, 220, 240, .5);
    --surface: rgba(34, 29, 60, .72); --surface-solid: #221d3c; --surface-2: rgba(46, 39, 80, .72);
    --ink: #f2edff; --muted: #a9a1ca; --line: #3a3363;
    --accent: #f5b8d2; --accent-2: #afd3f7; --accent-ink: #231d38; --accent-deep: #f5b8d2; --accent-soft: #45293f; --blue-soft: #1f3150;
    --danger: #ff7d8f; --danger-soft: #4a1f2b; --warn: #ffbd7a; --warn-soft: #43301c; --ok: #6fdcaa; --ok-soft: #173a2e; --info: #8fb8ff; --info-soft: #1f2f58;
    --c1: #ff85b5; --c2: #ffb07a; --c3: #f0d060; --c4: #62d4ad; --c5: #7ab8ff; --c6: #b89cff;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    --overlay: rgba(5, 3, 15, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14112a; --glow-1: #4d2552; --glow-2: #1c3566; --glow-3: #2d2260; --star: rgba(255, 220, 240, .5);
  --surface: rgba(34, 29, 60, .72); --surface-solid: #221d3c; --surface-2: rgba(46, 39, 80, .72);
  --ink: #f2edff; --muted: #a9a1ca; --line: #3a3363;
  --accent: #f5b8d2; --accent-2: #afd3f7; --accent-ink: #231d38; --accent-deep: #f5b8d2; --accent-soft: #45293f; --blue-soft: #1f3150;
  --danger: #ff7d8f; --danger-soft: #4a1f2b; --warn: #ffbd7a; --warn-soft: #43301c; --ok: #6fdcaa; --ok-soft: #173a2e; --info: #8fb8ff; --info-soft: #1f2f58;
  --c1: #ff85b5; --c2: #ffb07a; --c3: #f0d060; --c4: #62d4ad; --c5: #7ab8ff; --c6: #b89cff;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  --overlay: rgba(5, 3, 15, .55);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent-deep); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Dreamy sky behind everything */
.sky { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  background:
    radial-gradient(60vmax 45vmax at 8% 0%, var(--glow-1), transparent 62%),
    radial-gradient(55vmax 45vmax at 100% 100%, var(--glow-2), transparent 60%),
    radial-gradient(40vmax 35vmax at 70% 20%, var(--glow-3), transparent 65%),
    var(--bg); }
.sky::after { content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(1.4px 1.4px at 20px 30px, var(--star), transparent 60%), radial-gradient(1px 1px at 120px 80px, var(--star), transparent 60%), radial-gradient(1.2px 1.2px at 200px 160px, var(--star), transparent 60%), radial-gradient(1px 1px at 60px 190px, var(--star), transparent 60%);
  background-size: 240px 220px; }

#app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }

/* Rail */
.rail { background: var(--surface); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-right: 1px solid var(--line); padding: 20px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 11px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); flex: none; }
.brand-mark svg { width: 18px; height: 18px; }
.brand-text { flex: 1; min-width: 0; }
.brand b { font-family: var(--font-display); font-size: 18px; font-weight: 700; display: block; line-height: 1.15; letter-spacing: .01em; }
.brand small { color: var(--muted); font-size: 12px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface-solid); flex: none; }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; color: var(--muted); }
.lang button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); }
.lang button svg { width: 13px; height: 13px; display: block; }
.prefs { display: flex; gap: 8px; padding: 0 6px; }
.rail-label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 10px; margin-bottom: 4px; font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 10px; color: var(--ink); font-weight: 600; }
.nav-item:hover { background: var(--surface-2); }
.nav-item.active { background: linear-gradient(90deg, var(--accent-soft), var(--blue-soft)); }
.nav-item .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.dot.hub { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.badge { font-size: 11px; font-weight: 800; background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 0 7px; line-height: 18px; font-variant-numeric: tabular-nums; }
.new-plan { display: flex; gap: 6px; padding: 4px 2px 0; }
.new-plan input { flex: 1; min-width: 0; }
.rail > nav:last-of-type { margin-top: auto; }
.rail-foot { font-size: 12px; color: var(--muted); padding: 0 10px; display: flex; gap: 6px; align-items: flex-start; }
.sync-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; background: var(--warn); }
.sync-dot.on { background: var(--ok); }

/* Controls */
.input, select.input, textarea.input { background: var(--surface-solid); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; min-height: 34px; }
.input:focus { border-color: var(--accent-deep); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.btn { border: 1px solid var(--line); background: var(--surface-solid); border-radius: 999px; padding: 6px 14px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--accent-ink); font-weight: 700; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: var(--surface-solid); }
.icon-btn { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* Main */
main { min-width: 0; padding-inline: 28px; padding-block: 22px 44px; display: flex; flex-direction: column; gap: 16px; }
.head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.head h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -.005em; text-wrap: balance; display: flex; align-items: center; gap: 10px; }
.head h1 .dot { width: 14px; height: 14px; }
.head .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
.head .spacer { flex: 1; }
.tabs { display: flex; gap: 4px; overflow-x: auto; background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 999px; padding: 4px; align-self: flex-start; max-width: 100%; }
.tab { border: 0; background: none; padding: 6px 16px; color: var(--muted); border-radius: 999px; white-space: nowrap; font-weight: 700; }
.tab:hover { color: var(--ink); }
.tab.active { color: var(--accent-ink); background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .input { min-height: 32px; }
.toolbar #f-q { width: 220px; max-width: 100%; }
.toolbar label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; font-weight: 600; }
.toolbar .grow { flex: 1; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 20px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; font-weight: 700; }
.chip svg { width: 12px; height: 12px; }
.chip.overdue { background: var(--danger); color: var(--surface-solid); }
.chip.today { background: var(--warn-soft); color: var(--warn); }
.chip.tomorrow, .chip.week { background: var(--info-soft); color: var(--info); }
.chip.done { background: var(--ok-soft); color: var(--ok); }
.chip.pri-urgent { background: var(--danger-soft); color: var(--danger); }
.chip.pri-important { background: var(--warn-soft); color: var(--warn); }
.chip.doing { background: var(--info-soft); color: var(--info); }
.lbl-c1 { --lc: var(--c1); } .lbl-c2 { --lc: var(--c2); } .lbl-c3 { --lc: var(--c3); } .lbl-c4 { --lc: var(--c4); } .lbl-c5 { --lc: var(--c5); } .lbl-c6 { --lc: var(--c6); }
.bg-c1 { background: var(--c1); } .bg-c2 { background: var(--c2); } .bg-c3 { background: var(--c3); } .bg-c4 { background: var(--c4); } .bg-c5 { background: var(--c5); } .bg-c6 { background: var(--c6); }
.tag { font-size: 11px; line-height: 18px; padding: 0 8px; border-radius: 999px; color: var(--ink); background: color-mix(in srgb, var(--lc) 20%, transparent); border: 1px solid color-mix(in srgb, var(--lc) 45%, transparent); white-space: nowrap; font-weight: 700; }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; flex: none; }

/* Board */
.board { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding-bottom: 12px; }
.col { flex: 0 0 286px; background: var(--surface-2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; padding: 10px; display: flex; flex-direction: column; gap: 8px; border: 1.5px solid var(--line); }
.col.drop-ok { border-color: var(--accent); border-style: dashed; }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 6px; }
.col-head h3 { margin: 0; font-family: var(--font-display); font-size: 15px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-head .count { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.col-head.overdue h3 { color: var(--danger); }
.col-head[draggable="true"] { cursor: grab; }
.col-move { display: flex; opacity: 0; }
.col:hover .col-move, .col-move:focus-within { opacity: 1; }
@media (hover: none) { .col-move { opacity: 1; } }
.col-move .icon-btn { width: 22px; height: 22px; font-size: 16px; line-height: 1; font-weight: 700; }
.col-move .icon-btn:disabled { opacity: .25; cursor: default; background: transparent; }
.col.bucket-dragging { opacity: .45; }
.btn.mini { min-height: 24px; padding: 1px 10px; font-size: 12px; }
.btn.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: var(--accent-ink); }
.selbox { width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted); flex: none; margin-top: 1px; display: grid; place-items: center; color: transparent; background: var(--surface-solid); }
.selbox svg { width: 11px; height: 11px; }
.selbox.on { background: var(--accent-deep); border-color: var(--accent-deep); color: #fff; }
.card.selected { border-color: var(--accent-deep); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow); }
.grid tr.selected td { background: var(--accent-soft); }
.selbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: max-content; max-width: calc(100% - 32px); background: var(--surface-solid); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(80, 50, 120, .18); padding: 8px 10px 8px 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.selbar .n { font-weight: 800; margin-right: 6px; }
.selbar .hint { color: var(--muted); font-size: 12px; font-weight: 600; }
.selbar .q { font-weight: 700; color: var(--danger); }
main.selecting { padding-bottom: 110px; }
.col.drop-before { box-shadow: -5px 0 0 0 var(--accent-deep); }
.col.drop-after { box-shadow: 5px 0 0 0 var(--accent-deep); }
.qa { width: 100%; background: var(--surface); border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: 10px; padding: 7px 10px; min-height: 36px; }
.qa::placeholder { color: var(--muted); }
.qa:focus { border-style: solid; border-color: var(--accent); outline: none; background: var(--surface-solid); }
.card { background: var(--surface-solid); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; border: 1px solid transparent; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.card.is-done h4 { text-decoration: line-through; color: var(--muted); }
.card.is-done { opacity: .72; }
.card.dragging { opacity: .4; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.card-top { display: flex; gap: 8px; align-items: flex-start; }
.card-top h4 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.4; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.check { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--muted); background: transparent; flex: none; margin-top: 1px; display: grid; place-items: center; padding: 0; color: transparent; }
.check:hover { border-color: var(--ok); color: var(--ok); }
.check.on { background: var(--ok); border-color: var(--ok); color: var(--surface-solid); }
.check svg { width: 11px; height: 11px; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.card-meta .avatar { margin-left: auto; }
.add-col { flex: 0 0 230px; }
.empty-col { color: var(--muted); font-size: 12px; text-align: center; padding: 10px 0 4px; }

/* Grid */
.table-wrap { overflow-x: auto; background: var(--surface); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; }
table.grid { width: 100%; border-collapse: collapse; min-width: 820px; }
.grid th { text-align: left; font-size: 12px; font-weight: 800; color: var(--muted); padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; }
.grid th[data-sort] { cursor: pointer; }
.grid th[data-sort]:hover { color: var(--ink); }
.grid td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.grid tr:last-child td { border-bottom: 0; }
.grid tbody tr { cursor: pointer; }
.grid tbody tr:hover td { background: var(--surface-2); }
.grid td.title { font-weight: 700; }
.grid tr.is-done td.title { text-decoration: line-through; color: var(--muted); }
.faint { color: var(--muted); }

/* Schedule */
.cal-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cal-bar h2 { font-family: var(--font-display); margin: 0 8px 0 0; font-size: 19px; font-weight: 700; min-width: 150px; }
.cal-bar .hint { color: var(--muted); font-size: 12px; font-weight: 600; }
.cal-wrap { overflow-x: auto; }
.cal { min-width: 720px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--line); gap: 1px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.cal .dow { background: var(--surface-2); font-size: 12px; color: var(--muted); padding: 7px 8px; font-weight: 800; }
.cal .day { background: var(--surface-solid); min-height: 110px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cal .day.out { background: color-mix(in srgb, var(--surface-solid) 55%, var(--bg)); }
.cal .day.out .n { opacity: .45; }
.cal .day.weekend { background: color-mix(in srgb, var(--surface-solid) 82%, var(--accent-soft)); }
.cal .day-head { display: flex; align-items: center; justify-content: space-between; }
.cal .n { font-size: 12px; font-weight: 700; color: var(--muted); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-variant-numeric: tabular-nums; }
.cal .day.is-today .n { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: var(--accent-ink); }
.cal .add { opacity: 0; width: 22px; height: 22px; }
.cal .day:hover .add, .cal .add:focus-visible { opacity: 1; }
.cal-task { font-size: 12px; line-height: 1.35; padding: 3px 7px; border-radius: 6px; background: var(--surface-2); border: 0; border-left: 3px solid var(--muted); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; width: 100%; font-weight: 600; }
.cal-task.overdue { border-left-color: var(--danger); background: var(--danger-soft); }
.cal-task.today { border-left-color: var(--warn); background: var(--warn-soft); }
.cal-task.done { border-left-color: var(--ok); text-decoration: line-through; color: var(--muted); }
.cal-task.week, .cal-task.tomorrow, .cal-task.nextweek, .cal-task.later { border-left-color: var(--info); background: var(--info-soft); }
.cal.week-mode .day { min-height: 170px; }
.cal .day.busy { background: color-mix(in srgb, var(--surface-solid) 62%, var(--warn-soft)); }
.cal .cnt { font-size: 11px; font-weight: 800; color: var(--muted); padding-right: 4px; font-variant-numeric: tabular-nums; }
.cal .day.busy .cnt { color: var(--warn); }
.cal-task.pc { border-left-color: var(--pc); }
.plan-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); font-weight: 700; margin: 2px 0 10px; }
.plan-legend span { display: inline-flex; align-items: center; gap: 6px; }
.hub-cal .cal-bar { margin-bottom: 8px; }
.hub-cal .cal-bar h2 { margin: 0; }
.bk { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-top: 1px solid var(--line); }

function applyFilter(list) {
  const f = ui.filter, q = f.q.trim().toLowerCase(), td = today();
  return list.filter(t => {
    if (f.hideDone && t.progress === 'done') return false;
    if (f.pri !== 'all' && t.priority !== f.pri) return false;
    if (f.due !== 'all') {
      const s = dueStatus(t);
      if (f.due === 'overdue' && s !== 'overdue') return false;
      if (f.due === 'today' && s !== 'today') return false;
      if (f.due === 'week' && !(t.due && t.progress !== 'done' && t.due >= td && t.due <= endOfWeek(td))) return false;
      if (f.due === 'next14' && !(t.due && t.progress !== 'done' && t.due >= td && t.due <= addDays(td, 14))) return false;
      if (f.due === 'none' && t.due) return false;
    }
    if (q && !`${t.title} ${t.assignee || ''} ${t.notes || ''}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

  if (g === 'priority') return Object.entries(L.priority).map(([k, v]) => ({ key: k, name: v, match: t => (t.priority || 'medium') === k, drop: { priority: k }, add: { priority: k } }));
  if (g === 'due') {
    const dates = { overdue: null, today: td, tomorrow: addDays(td, 1), week: null, nextweek: null, later: null, none: '' };
    return Object.entries(dates).map(([k, date]) => ({ key: k, name: L.dueGroups[k], match: t => dueGroup(t) === k, drop: date === null ? null : { due: date }, add: date === null ? null : { due: date }, cls: k === 'overdue' ? 'overdue' : '' }));

  const ids = plan.buckets.map(b => b.id);

}

function monthCells(y, m) {
  const first = new Date(y, m - 1, 1);
  const d = new Date(first); d.setDate(1 - ((first.getDay() + 6) % 7));
  const last = new Date(y, m, 0);
  const cells = [];
  while (d <= last || cells.length % 7 !== 0) { cells.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return cells;
}
function weekCells(anchor) {
  const s0 = addDays(anchor, -((parse(anchor).getDay() + 6) % 7));
  return Array.from({ length: 7 }, (_, i) => addDays(s0, i));
}

function gradesHTML(plan) {
  const L = T(), RO = state.readonly, dis = RO ? 'disabled' : '';
  const tasks = tasksOf(plan.id);
  const g = gradeStats(tasks);
  const items = g.items.slice().sort((a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : (a.createdAt || 0) - (b.createdAt || 0));
  const others = tasks.filter(t => !isGradeItem(t)).sort(cmpTasks);
  const remW = Math.max(0, 100 - g.gradedW);
  const target = typeof plan.gradeTarget === 'number' ? plan.gradeTarget : '';
  let msg = '', msgCls = '';
  if (g.items.length && g.gradedW >= 100) { msg = L.finalGrade(fmtNum(g.earned)); msgCls = 'ok'; }
  else if (target !== '' && g.items.length) {
    const need = (target - g.earned) / remW * 100;
    if (need <= 0) { msg = L.targetSafe(fmtNum(target)); msgCls = 'ok'; }
    else if (need > 100) { msg = L.targetOut(fmtNum(target)); msgCls = 'bad'; }
    else msg = L.needAvg(fmtNum(need), fmtNum(remW), fmtNum(target));
  }
  const addRow = RO ? '' : `<div class="grade-add">
      <form id="grade-new" style="display:flex;gap:8px;flex:2 1 300px"><input class="input" id="grade-new-name" placeholder="${esc(L.newGradePh)}" maxlength="200" autocomplete="off"><button class="btn" type="submit">${esc(L.add)}</button></form>
      ${others.length ? `<select class="input" id="grade-pick" style="flex:1 1 220px"><option value="">${esc(L.addGradeItem)}</option>${others.map(t => `<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select>` : ''}
    </div>`;
  if (!g.items.length) return `<div class="empty"><h2>${esc(L.gradesEmptyH)}</h2><p>${esc(L.gradesEmptyP)}</p></div><div class="panel" style="margin-top:12px">${addRow}</div>`;
  const num = (t, f, val) => `<input class="input" type="number" inputmode="decimal" min="0" step="any" id="g-${f}-${t.id}" data-gid="${t.id}" data-gf="${f}" value="${val == null ? '' : esc(fmtNum(val))}" ${dis}>`;
  return `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">

const statusOf = t => dueStatus(t) === 'overdue' ? 'overdue' : (t.progress || 'todo');
function stackBar(list, total, h) {
  const L = T();
  const c = { todo: 0, doing: 0, done: 0, overdue: 0 };
  list.forEach(t => c[statusOf(t)]++);
  const w = n => total ? (n / total * 100).toFixed(2) + '%' : '0';
  const name = k => k === 'overdue' ? L.overdue : L.progress[k];
  return `<div class="bar" ${h ? `style="height:${h}px"` : ''}>${['done', 'doing', 'todo', 'overdue'].map(k => c[k] ? `<i class="s-${k}" style="width:${w(c[k])}" title="${esc(name(k))} ${c[k]}"></i>` : '').join('')}</div>`;
}

function chartsHTML(plan) {
  const L = T();
  const tasks = tasksOf(plan.id);
  if (!tasks.length) return `<div class="empty"><h2>${esc(L.noTasksH)}</h2><p>${esc(L.noTasksP)}</p></div>`;
  const cnt = { todo: 0, doing: 0, done: 0, overdue: 0 };
  tasks.forEach(t => cnt[statusOf(t)]++);
  const legend = `<div class="legend"><span><i class="s-done"></i>${esc(L.progress.done)}</span><span><i class="s-doing"></i>${esc(L.progress.doing)}</span><span><i class="s-todo"></i>${esc(L.progress.todo)}</span><span><i class="s-overdue"></i>${esc(L.overdue)}</span></div>`;
  const rows = groups => {
    const max = Math.max(1, ...groups.map(g => g.list.length));
    return `<div class="hbars">${groups.map(g => `<div class="hbar"><span class="n" title="${esc(g.name)}">${esc(g.name)}</span><div style="width:${(g.list.length / max * 100).toFixed(2)}%;min-width:${g.list.length ? '4px' : '0'}">${stackBar(g.list, g.list.length)}</div><span class="v">${g.list.length}</span></div>`).join('')}</div>`;
  };
  const ids = plan.buckets.map(b => b.id);
  const byBucket = plan.buckets.map((b, i) => ({ name: bName(b.name), list: tasks.filter(t => t.bucketId === b.id || (i === 0 && !ids.includes(t.bucketId))) }));
  const byPri = Object.entries(L.priority).map(([k, v]) => ({ name: v, list: tasks.filter(t => (t.priority || 'medium') === k) }));
  const people = {};
  tasks.filter(t => t.progress !== 'done').forEach(t => { const n = t.assignee?.trim() || L.unassigned; (people[n] = people[n] || []).push(t); });
  const byPerson = Object.entries(people).map(([name, list]) => ({ name, list })).sort((a, b) => b.list.length - a.list.length);
  return `<div style="display:flex;flex-direction:column;gap:16px">
    <div class="stats">
      <div class="stat"><span class="k">${esc(L.progress.todo)}</span><span class="v">${cnt.todo}</span></div>
      <div class="stat info"><span class="k">${esc(L.progress.doing)}</span><span class="v">${cnt.doing}</span></div>
      <div class="stat ok"><span class="k">${esc(L.progress.done)}</span><span class="v">${cnt.done}</span></div>
      <div class="stat danger"><span class="k">${esc(L.overdue)}</span><span class="v">${cnt.overdue}</span></div>
    </div>
    <div class="charts">
      <div class="panel"><h2>${esc(L.byBucket)}</h2>${legend}${rows(byBucket)}</div>
      <div class="panel"><h2>${esc(L.byPriority)}</h2>${legend}${rows(byPri)}</div>
      <div class="panel"><h2>${esc(L.byPerson)} <small>${esc(L.openOnly)}</small></h2>${legend}${byPerson.length ? rows(byPerson) : `<p class="faint" style="margin:0">${esc(L.allDone)}</p>`}</div>
      <div class="panel"><h2>${esc(L.overall)}</h2>
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap"><span class="big-pct">${Math.round(cnt.done / tasks.length * 100)}%</span><span class="faint">${esc(L.doneOf(cnt.done, tasks.length))}</span></div>
        ${stackBar(tasks, tasks.length, 14)}
      </div>
    </div>
  </div>`;
}

function hubHTML() {
  const RO = state.readonly, L = T();
  const plans = activePlans();
  const td = today();
  const dayLine = `${fmtDate(td)} ${weekday(td)}`;
  if (!plans.length) {
    return `<div class="head"><h1>${esc(L.overview)}</h1><span class="sub">${esc(L.todayIs(dayLine))}</span></div>
      <div class="empty"><h2>${esc(L.noPlansH)}</h2><p>${esc(L.noPlansP)}</p>${!RO ? `<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-act="new-plan-show">${esc(L.firstPlan)}</button><button class="btn" data-act="backup">${ICON_BACKUP}${esc(L.orImport)}</button></div>` : ''}</div>`;
  }
  const open = allTasks().filter(t => t.progress !== 'done');
  const eow = endOfWeek(td);
  const overdue = open.filter(t => t.due && t.due < td);
  const dueToday = open.filter(t => t.due === td);
  const dueWeek = open.filter(t => t.due && t.due >= td && t.due <= eow);
  const doing = open.filter(t => t.progress === 'doing');
  const soon = open.filter(t => t.due).sort(cmpTasks);
  const groups = [
    ['overdue', L.dueGroups.overdue, soon.filter(t => t.due < td)],
    ['today', L.dueGroups.today, soon.filter(t => t.due === td)],
    ['week', L.restOfWeek, soon.filter(t => t.due > td && t.due <= eow)],
    ['next', L.next14, soon.filter(t => t.due > eow && t.due <= addDays(td, 14))],
    ['later', L.dueGroups.later, soon.filter(t => t.due > addDays(td, 14))]
  ].filter(g => g[2].length);
  return `
    ${hubHeadHTML()}
    <div class="stats">
      <button class="stat danger" data-act="hub-filter" data-due="overdue"><span class="k">${esc(L.statOverdue)}</span><span class="v">${overdue.length}</span></button>
      <button class="stat warn" data-act="hub-filter" data-due="today"><span class="k">${esc(L.statToday)}</span><span class="v">${dueToday.length}</span></button>
      <button class="stat info" data-act="hub-filter" data-due="week"><span class="k">${esc(L.statWeek)}</span><span class="v">${dueWeek.length}</span></button>
      <div class="stat"><span class="k">${esc(L.statDoing)}</span><span class="v">${doing.length}</span></div>
    </div>
    ${hubCalendarHTML()}
    <div class="hub">
      <section class="panel"><h2>${esc(L.deadlines)} <small>${esc(L.deadlinesSub)}</small></h2>
        ${groups.length ? `<div class="due-list">${groups.map(([k, name, list]) => `<div class="due-group ${k === 'overdue' ? 'overdue' : ''}">${esc(name)} · ${list.length}</div>${list.map(t => {
          const p = state.plans[t.planId];
          return `<div class="due-row cd-row" data-act="open-task" data-id="${t.id}" tabindex="0">
            <button class="check" data-act="toggle-done" data-id="${t.id}" aria-label="${esc(L.markDone)}" ${RO ? 'disabled' : ''}>${ICON_CHECK}</button>
            <div style="min-width:0"><div class="t">${esc(t.title)}</div><div class="p"><span class="dot bg-${esc(p.color)}" style="width:8px;height:8px"></span>${esc(p.name)}${t.assignee ? ' · ' + esc(t.assignee) : ''}</div></div>
            <span class="faint" style="font-size:12px;font-weight:700">${esc(fmtDate(t.due))}</span>
            ${countdownHTML(t)}
          </div>`;
        }).join('')}`).join('')}</div>` : `<p class="faint" style="margin:0">${esc(L.noDeadlines)}</p>`}
      </section>
      <section class="panel"><h2>${esc(L.allPlans)} <small>${esc(L.plansN(plans.length))}</small></h2>
        <div class="plan-cards">${plans.map(p => {
          const ts = tasksOf(p.id);
          const done = ts.filter(t => t.progress === 'done').length;
          const od = ts.filter(t => dueStatus(t) === 'overdue').length;
          const wk = ts.filter(t => t.progress !== 'done' && t.due && t.due >= td && t.due <= eow).length;
          const next = ts.filter(t => t.progress !== 'done' && t.due && t.due >= td).sort(cmpTasks)[0];
          return `<button class="plan-card" data-act="goto" data-plan="${p.id}">
            <div class="row"><span class="dot bg-${esc(p.color)}"></span><b>${esc(p.name)}</b><span class="faint num" style="font-size:12px;font-weight:700">${done}/${ts.length}</span></div>
            ${stackBar(ts, ts.length)}
            <div class="nums"><span class="${od ? 'od' : ''}">${esc(L.overdueLbl)} <b>${od}</b></span><span>${esc(L.weekLbl)} <b>${wk}</b></span>${next ? `<span>${esc(L.nextDueIn(fmtDate(next.due), L.cd(diffDays(td, next.due))))}</span>` : ''}${(() => { const g = gradeStats(ts); return g.current != null ? `<span>${esc(L.gradeShort(fmtNum(g.current)))}</span>` : ''; })()}</div>
          </button>`;
        }).join('')}</div>
      </section>
    </div>`;
}

let openTaskId = null;
let openPlanSettingsId = null;

function closeDialog() {
  if (openTaskId) flushTaskDialog();
  if (openClassId) { const ti = $('#c-title'); const c = state.classes[openClassId]; if (ti && c && ti.value.trim() && ti.value.trim() !== c.title && !state.readonly) patchClass(openClassId, { title: ti.value.trim() }); openClassId = null; }
  closeBackup();
  openTaskId = null; openPlanSettingsId = null;
  $('#dialog-root').innerHTML = '';
}
function flushTaskDialog() {
  const t = state.tasks[openTaskId]; if (!t || state.readonly) return;
  const title = $('#t-title')?.value.trim();
  const notes = $('#t-notes')?.value;

  if (title && title !== t.title) patch.title = title;
  if (notes != null && notes !== (t.notes || '')) patch.notes = notes;
  if (Object.keys(patch).length) patchTask(t.id, patch);
}

  if (e.key === 'Escape' && $('#dialog-root').firstChild) { closeDialog(); return; }
  if (e.key === 'Escape' && sel.on) { exitSelect(); render(); return; }
  if (e.key === 'Escape' && e.target.id === 'hub-q' && hubQ) { hubQ = ''; render(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && undoState && !(e.target.closest && e.target.closest('input, textarea'))) { e.preventDefault(); undoDelete(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="sel-card"]')) { e.preventDefault(); e.target.click(); return; }
  if (e.key === 'Enter' && e.target.matches('[data-act="open-task"]') && !e.target.matches('button')) { openTask(e.target.dataset.id); return; }
  if (e.key === 'Enter' && e.target.matches('.class-row')) { openClass(e.target.dataset.id); return; }
  if (e.key === 'Enter' && e.target.classList.contains('qa')) {
    e.preventDefault();
    const title = e.target.value.trim(); if (!title) return;
    const add = JSON.parse(e.target.dataset.add || '{}');
    e.target.value = '';
    createTask(ui.planId, Object.assign({ title }, add));
    // keep focus in the same quick-add box for rapid entry
    const id = e.target.id; requestAnimationFrame(() => document.getElementById(id)?.focus());
    return;
  }
  // single-key shortcuts, only when not typing and no window is open
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
  if ($('#dialog-root').firstChild || state.mode === 'signin' || !state.plansReady) return;
  const k = e.key, inPlan = ui.planId !== 'hub' && state.plans[ui.planId];
  if (k === '?') { e.preventDefault(); openShortcuts(); }
  else if (k === '/') { const q = $('#f-q') || $('#hub-q'); if (q) { e.preventDefault(); q.focus(); q.select(); } }
  else if (k === 'n' || k === 'N') {
    if (state.readonly) return;
    e.preventDefault();
    if (inPlan) { const id = createTask(ui.planId, { bucketId: state.plans[ui.planId].buckets[0]?.id }); if (id) openTask(id, true); }
    else if (ui.planId === 'timetable') { const id = createClass({}); openClass(id, true); }
    else { const f = $('#new-plan-form'); if (f) { f.hidden = false; $('#new-plan-name').focus(); } }
  }
  else if (inPlan && ['1', '2', '3', '4', '5'].includes(k)) {
    const v = ['board', 'grid', 'schedule', 'charts', 'grades'][+k - 1];
    if (v !== 'board' && v !== 'grid') exitSelect();
    ui.view = v; savePrefs(); render();
  }
});

let qTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'hub-q') {
    clearTimeout(qTimer);
    const v = e.target.value;
    qTimer = setTimeout(() => { hubQ = v; render(); }, 180);
    return;
  }
  if (e.target.id === 'f-q') {
    clearTimeout(qTimer);
    const v = e.target.value;
    qTimer = setTimeout(() => { ui.filter.q = v; savePrefs(); render(); }, 180);
  }
});

document.addEventListener('change', e => {
  const el = e.target, id = el.id;
  if (id === 'imp-file') {
    const file = el.files && el.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const data = parseBackup(String(reader.result || ''));
      pendingImport = data; importConfirm = false;
      importError = data ? '' : T().badFile;
      openBackup();
    };
    reader.onerror = () => { pendingImport = null; importError = T().badFile; openBackup(); };
    reader.readAsText(file);
    return;
  }
  if (id === 'f-due') { ui.filter.due = el.value; savePrefs(); render(); return; }
  if (id === 'f-pri') { ui.filter.pri = el.value; savePrefs(); render(); return; }
  if (id === 'f-done') { ui.filter.hideDone = el.checked; savePrefs(); render(); return; }
  if (id === 'f-group') { ui.groupBy = el.value; savePrefs(); render(); return; }
  if (el.dataset && el.dataset.gf && !state.readonly) {
    const t2 = state.tasks[el.dataset.gid]; if (!t2) return;
    const patch = gradePatch(el.dataset.gf, el.value);
    if (el.dataset.gf === 'score' && !(t2.outOf > 0)) patch.outOf = 100;
    patchTask(t2.id, patch, true); setTimeout(render, 0); return;
  }
  if (id === 'grade-target' && !state.readonly) {
    const n = numOrNull(el.value);
    patchPlan(ui.planId, { gradeTarget: n == null ? null : Math.max(0, Math.min(100, n)) }); return;
  }
  if (id === 'grade-pick' && el.value && !state.readonly) { patchTask(el.value, { inGrades: true }); return; }
  if (openClassId && /^c-/.test(id) && !state.readonly) {
    const c = state.classes[openClassId]; if (!c) return;
    if (id === 'c-title') { const v = el.value.trim(); if (v) patchClass(c.id, { title: v }); else el.value = c.title; }
    else if (id === 'c-day') patchClass(c.id, { day: +el.value });
    else if (id === 'c-start' || id === 'c-end') {
      const st = id === 'c-start' ? el.value : c.start, en = id === 'c-end' ? el.value : c.end;
      if (!validTime(st) || !validTime(en)) { el.value = id === 'c-start' ? c.start : c.end; return; }
      // if the end is not after the start, make the class one hour long
      const fixedEnd = toMin(en) > toMin(st) ? en : fromMin(Math.min(toMin(st) + 60, 23 * 60 + 59));
      patchClass(c.id, { start: st, end: fixedEnd });
      if (fixedEnd !== en) $('#c-end').value = fixedEnd;
    }
    else if (id === 'c-code') patchClass(c.id, { code: el.value.trim() });
    else if (id === 'c-type') patchClass(c.id, { type: el.value.trim() });
    else if (id === 'c-room') patchClass(c.id, { room: el.value.trim() });
    else if (id === 'c-lecturer') patchClass(c.id, { lecturer: el.value.trim() });
    else if (id === 'c-plan') { patchClass(c.id, { planId: el.value }); openClass(c.id); }
    return;
  }
  if (id === 'f-sort') { ui.boardSort = el.value === 'manual' ? 'manual' : 'due'; savePrefs(); render(); return; }
  if (state.readonly) return;
  const t = state.tasks[openTaskId];
  if (t) {
    if (id === 't-title') { const v = el.value.trim(); if (v && v !== t.title) patchTask(t.id, { title: v }); else el.value = t.title; }
    else if (id === 't-bucket') patchTask(t.id, { bucketId: el.value });
    else if (id === 't-progress') { patchTask(t.id, { progress: el.value }); $('#t-foot').innerHTML = taskFootHTML(state.tasks[t.id]); }
    else if (id === 't-priority') patchTask(t.id, { priority: el.value });
    else if (id === 't-start') patchTask(t.id, { start: el.value });
    else if (id === 't-due') { patchTask(t.id, { due: el.value }); openTask(t.id); }
    else if (id === 't-assignee') patchTask(t.id, { assignee: el.value.trim() });
    else if (id === 't-repeat') patchTask(t.id, { repeat: el.value, repeatSpawned: false });
    else if (id === 't-weight') patchTask(t.id, gradePatch('weight', el.value));
    else if (id === 't-score') patchTask(t.id, Object.assign(gradePatch('score', el.value), t.outOf > 0 ? {} : { outOf: 100 }));
    else if (id === 't-outof') patchTask(t.id, gradePatch('outOf', el.value));
    else if (id === 't-notes') patchTask(t.id, { notes: el.value });
    else if (el.dataset.cl && el.type === 'text') {
      const v = el.value.trim();
      patchTask(t.id, { checklist: v ? t.checklist.map(c => c.id === el.dataset.cl ? Object.assign({}, c, { text: v }) : c) : t.checklist.filter(c => c.id !== el.dataset.cl) });
      if (!v) refreshChecklist();
    }
    return;
  }
  const p = state.plans[openPlanSettingsId];
  if (p) {
    if (id === 'p-name') { const v = el.value.trim(); if (v && v !== p.name) patchPlan(p.id, { name: v }); else el.value = p.name; }
    else if (el.dataset.bucket) {
      const v = el.value.trim();
      if (v) patchPlan(p.id, { buckets: p.buckets.map(b => b.id === el.dataset.bucket ? { id: b.id, name: v } : b) });
      else el.value = bName(p.buckets.find(b => b.id === el.dataset.bucket)?.name || '');
    } else if (el.dataset.labelname) {
      // store only custom names so default labels follow the language setting
      const k = el.dataset.labelname, v = el.value.trim();
      const labels = Object.assign({}, p.labels);
      if (!v || v === I18N.en.labels[k] || v === I18N.zh.labels[k]) delete labels[k]; else labels[k] = v;
      patchPlan(p.id, { labels });
      if (!v) el.value = T().labels[k];
    }
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (state.readonly) return;
  if (f.id === 'new-plan-form') {
    const name = $('#new-plan-name').value.trim(); if (!name) return;
    const id = createPlan(name);
    ui.planId = id; ui.view = 'board'; ui.groupBy = 'bucket'; savePrefs(); render();
  } else if (f.id === 'add-bucket-form') {
    const name = $('#add-bucket-name').value.trim(); if (!name) return;
    const p = state.plans[ui.planId];
    $('#add-bucket-name').value = '';
    patchPlan(p.id, { buckets: [...p.buckets, { id: uid(), name }] });
  } else if (f.id === 'p-bucket-add') {
    const name = $('#p-bucket-new').value.trim(); if (!name) return;
    const p = state.plans[openPlanSettingsId];
    patchPlan(p.id, { buckets: [...p.buckets, { id: uid(), name }] });
    openPlanSettings(p.id);
    $('#p-bucket-new').focus();
  } else if (f.id === 'grade-new') {
    const name = $('#grade-new-name').value.trim(); if (!name) return;
    $('#grade-new-name').value = '';
    createTask(ui.planId, { title: name, inGrades: true });
    setTimeout(() => $("#grade-new-name")?.focus(), 0);
  } else if (f.id === 'link-add') {
    const t = state.tasks[openTaskId]; if (!t) return;
    const url = normalizeUrl($('#link-url').value);
    if (!url) { toast(T().badLink); $('#link-url').focus(); return; }
    const title = $('#link-name').value.trim().slice(0, 80);
    patchTask(t.id, { links: [...(t.links || []), { id: uid(), url, title }] });
    refreshLinks();
    $('#link-url').focus();
  } else if (f.id === 'cl-add') {
    const text = $('#cl-new').value.trim(); if (!text) return;
    const t = state.tasks[openTaskId]; if (!t) return;
    patchTask(t.id, { checklist: [...(t.checklist || []), { id: uid(), text, done: false }] });
    refreshChecklist();
    $('#cl-new').focus();
  }
});

/* drag and drop between board columns */
let dragId = null;
let dragBucket = null;
document.addEventListener('dragstart', e => {
  const head = e.target.closest && e.target.closest('.col-head[draggable="true"]');
  if (head) {
    dragBucket = head.dataset.bucketId; head.closest('.col').classList.add('bucket-dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragBucket); } catch (err) {}
    return;
  }
  const card = e.target.closest && e.target.closest('.card[draggable="true"]');
  if (!card) return;
  dragId = card.dataset.id; card.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', dragId); } catch (err) {}
});
document.addEventListener('dragend', () => {
  dragId = null; dragBucket = null;
  document.querySelectorAll('.dragging, .drop-ok, .bucket-dragging, .drop-before, .drop-after, .ins-before, .ins-after').forEach(n => n.classList.remove('dragging', 'drop-ok', 'bucket-dragging', 'drop-before', 'drop-after', 'ins-before', 'ins-after'));
});
const dropSide = (col, e) => { const r = col.getBoundingClientRect(); return e.clientX < r.left + r.width / 2 ? 'before' : 'after'; };
document.addEventListener('dragover', e => {
  if (dragBucket) {
    const target = e.target.closest && e.target.closest('.col[data-bucket-id]');
    document.querySelectorAll('.drop-before, .drop-after').forEach(n => { if (n !== target) n.classList.remove('drop-before', 'drop-after'); });
    if (!target) return;
    e.preventDefault();
    const side = dropSide(target, e);
    target.classList.toggle('drop-before', side === 'before');
    target.classList.toggle('drop-after', side === 'after');
    return;
  }
  const col = e.target.closest && e.target.closest('.col');
  document.querySelectorAll('.drop-ok').forEach(n => { if (n !== col) n.classList.remove('drop-ok'); });
  const over = dragId && e.target.closest ? e.target.closest('.card') : null;
  document.querySelectorAll('.ins-before, .ins-after').forEach(n => { if (n !== over) n.classList.remove('ins-before', 'ins-after'); });
  if (!dragId || !col || !col.dataset.drop) return;
  e.preventDefault(); col.classList.add('drop-ok');
  if (over && over.dataset.id !== dragId && col.contains(over)) {
    const side = cardSide(over, e);
    over.classList.toggle('ins-before', side === 'before');
    over.classList.toggle('ins-after', side === 'after');
  }
});
const cardSide = (card, e) => { const r = card.getBoundingClientRect(); return e.clientY < r.top + r.height / 2 ? 'before' : 'after'; };
document.addEventListener('drop', e => {
  if (dragBucket) {
    const target = e.target.closest && e.target.closest('.col[data-bucket-id]');
    const id = dragBucket; dragBucket = null;
    if (!target) return;
    e.preventDefault();
    const p = state.plans[ui.planId]; if (!p) return;
    const ids = p.buckets.map(b => b.id);
    const from = ids.indexOf(id);
    let to = ids.indexOf(target.dataset.bucketId) + (dropSide(target, e) === 'after' ? 1 : 0);
    if (from < to) to -= 1;
    moveBucket(p.id, id, to);
    return;
  }
  const col = e.target.closest && e.target.closest('.col');
  if (!dragId || !col || !col.dataset.drop) return;
  e.preventDefault();
  const id = dragId; dragId = null;
  const patch = JSON.parse(col.dataset.drop);
  const over = e.target.closest('.card');
  if (over && over.dataset.id !== id && col.contains(over)) {
    // dropped onto a card: place it before or after that card
    if (ui.boardSort !== 'manual') { normalizeOrder(ui.planId); ui.boardSort = 'manual'; savePrefs(); toast(T().sortSwitched); }
    const ids = [...col.querySelectorAll('.card')].map(c => c.dataset.id).filter(x => x !== id);
    const idx = ids.indexOf(over.dataset.id) + (cardSide(over, e) === 'after' ? 1 : 0);
    const o = x => orderOf(state.tasks[x]);
    const prev = ids[idx - 1], next = ids[idx];
    patch.order = prev && next ? (o(prev) + o(next)) / 2 : prev ? o(prev) + 1000 : next ? o(next) - 1000 : Date.now();
  } else if (col.contains(document.querySelector(`.card[data-id="${id}"]`))) {
    return; // dropped on empty space in its own column
  }
  patchTask(id, patch);
});

/* refresh "today" math when the date rolls over */
let lastDay = today();
setInterval(() => {
  if (today() !== lastDay) { lastDay = today(); remindedThisLoad = false; render(); return; }
  maybeRemind();
  // move the timetable's current-time line, unless a window is open
  if (ui.planId === 'timetable' && !$('#dialog-root').firstChild && document.visibilityState === 'visible') render();
}, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { lastBadge = -1; render(); } });

render();
initStore();
})();
</script>
